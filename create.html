<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create · Velorix AI</title>
<style>
:root{--bg:#0d0a14;--card:#14141c;--border:rgba(255,255,255,.09);--p:#a855f7;--p2:#7c3aed;--text:#fff;--muted:#a1a1aa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(13,10,20,.95);z-index:20}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.top h1{font-size:16px;font-weight:700;flex:1}
.lang-pill{font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 110px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.story-box{min-height:48vh;width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:15px;line-height:1.55;resize:vertical}
.story-box:focus{outline:none;border-color:rgba(168,85,247,.5)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--p);background:rgba(168,85,247,.2);color:#fff}
.size-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.size-item{padding:12px;border-radius:12px;border:1px solid var(--border);text-align:center;cursor:pointer;font-size:12px}
.size-item.on{border-color:var(--p);background:rgba(168,85,247,.18)}
.size-item b{display:block;font-size:14px;margin-bottom:4px}
.gal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gal-head h3{margin:0}
.btn-sm{padding:8px 12px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal-thumb{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#1a1325;border:1px solid var(--border);cursor:pointer}
.gal-thumb img{width:100%;height:100%;object-fit:cover}
.gal-empty{grid-column:1/-1;text-align:center;padding:24px 12px;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:14px}
.scene{background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.scene b{color:var(--p);font-size:12px}
.scene p{font-size:14px;line-height:1.45;margin-top:4px;color:#e4e4e7}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(13,10,20,.96) 28%);display:flex;gap:10px;z-index:30}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.btn-main{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn:disabled{opacity:.5}
.prog{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);align-items:center;justify-content:center;flex-direction:column;gap:12px}
.prog.on{display:flex}
.bar{width:64%;height:6px;background:#27272a;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .3s}
.prog p{font-size:13px;color:#ddd}
.viewer{display:none;position:fixed;inset:0;z-index:100;background:#000;flex-direction:column}
.viewer.on{display:flex}
.viewer-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.7)}
.viewer-top h2{flex:1;font-size:15px}
.viewer-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.viewer-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-actions{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.85)}
.edit-sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:110;background:#14141c;border-radius:18px 18px 0 0;padding:16px;border:1px solid var(--border)}
.edit-sheet.on{display:block}
.edit-sheet textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;padding:12px;font-size:14px;resize:none}
#filePick{display:none}
.err{color:#f87171;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" type="button" id="btnBackHome"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Create</h1>
    <span class="lang-pill" id="langPill">HI</span>
  </div>
  <div class="main">
    <div class="card">
      <h3>Story</h3>
      <textarea class="story-box" id="storyInput" placeholder="कहानी / विषय…"></textarea>
      <p class="err" id="storyErr"></p>
    </div>
    <div class="card">
      <h3>Size · पूरी पाइपलाइन</h3>
      <div class="size-grid" id="sizeGrid">
        <div class="size-item on" data-size="9:16"><b>9:16</b>Reels / Shorts</div>
        <div class="size-item" data-size="1:1"><b>1:1</b>Square</div>
        <div class="size-item" data-size="16:9"><b>16:9</b>YouTube</div>
        <div class="size-item" data-size="4:5"><b>4:5</b>Feed</div>
      </div>
    </div>
    <div class="card">
      <h3>Style</h3>
      <div class="row" id="styleRow">
        <span class="chip on" data-style="3d">3D</span>
        <span class="chip" data-style="2d">2D</span>
        <span class="chip" data-style="realistic">Realistic</span>
        <span class="chip" data-style="cinematic">Cinematic</span>
        <span class="chip" data-style="anime">Anime</span>
      </div>
    </div>
    <div class="card" id="scenesCard" style="display:none">
      <h3>Scenes</h3>
      <div id="scenesList"></div>
    </div>
    <div class="card">
      <div class="gal-head">
        <h3>Gallery</h3>
        <button class="btn-sm" type="button" id="btnPickPhone">📱 फोन से</button>
      </div>
      <div class="gal-grid" id="galGrid">
        <div class="gal-empty">अभी कोई फोटो नहीं · AI फोटो PART 3</div>
      </div>
      <input type="file" id="filePick" accept="image/*" multiple>
    </div>
  </div>
  <div class="bottom">
    <button class="btn btn-ghost" type="button" id="btnSaveDraft">Draft</button>
    <button class="btn btn-main" type="button" id="btnNext">Create Story</button>
  </div>
</div>

<div class="prog" id="prog"><div class="bar"><i id="progBar"></i></div><p id="progText">…</p></div>

<div class="viewer" id="viewer">
  <div class="viewer-top">
    <button class="back" type="button" id="btnViewerBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
    <h2 id="viewerTitle">Photo</h2>
  </div>
  <div class="viewer-img-wrap"><img id="viewerImg" alt=""></div>
  <div class="viewer-actions">
    <button class="btn btn-ghost" type="button" id="btnDownload">Download</button>
    <button class="btn btn-main" type="button" id="btnEdit">Edit</button>
  </div>
</div>
<div class="edit-sheet" id="editSheet">
  <p style="font-size:13px;color:var(--muted);margin-bottom:8px">क्या बदलना है?</p>
  <textarea id="editPrompt" placeholder="जैसे: कपड़े लाल…"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-ghost" type="button" id="btnEditCancel">Cancel</button>
    <button class="btn btn-main" type="button" id="btnEditGo">Apply Edit</button>
  </div>
</div>

<script>
(function(){
  var size="9:16", style="3d", currentPhoto=null, lastStory="", lastScenes=[];
  var lang=(localStorage.getItem("velorix_lang")||localStorage.getItem("VX_LANG")||"hi").toLowerCase();
  document.getElementById("langPill").textContent=lang.toUpperCase();

  try{
    var q=new URLSearchParams(location.search).get("q");
    var p=q||localStorage.getItem("VX_PROMPT")||"";
    if(p) document.getElementById("storyInput").value=p;
    size=localStorage.getItem("VX_SIZE")||size;
    style=localStorage.getItem("VX_STYLE")||style;
  }catch(e){}

  function keys(){
    return {
      groq: (localStorage.getItem("VX_GROQ")||"").trim(),
      gemini: (localStorage.getItem("VX_GEMINI")||"").trim(),
      or: (localStorage.getItem("VX_OR")||"").trim()
    };
  }

  function setProg(on,pct,msg){
    var el=document.getElementById("prog");
    if(on){el.classList.add("on");document.getElementById("progBar").style.width=(pct||10)+"%";document.getElementById("progText").textContent=msg||"…";}
    else el.classList.remove("on");
  }

  [].forEach.call(document.querySelectorAll(".size-item"),function(el){
    el.classList.toggle("on",el.getAttribute("data-size")===size);
    el.onclick=function(){
      size=el.getAttribute("data-size");
      [].forEach.call(document.querySelectorAll(".size-item"),function(x){x.classList.remove("on");});
      el.classList.add("on");
      try{localStorage.setItem("VX_SIZE",size);}catch(e){}
    };
  });
  [].forEach.call(document.querySelectorAll("#styleRow .chip"),function(el){
    el.classList.toggle("on",el.getAttribute("data-style")===style);
    el.onclick=function(){
      style=el.getAttribute("data-style");
      [].forEach.call(document.querySelectorAll("#styleRow .chip"),function(x){x.classList.remove("on");});
      el.classList.add("on");
      try{localStorage.setItem("VX_STYLE",style);}catch(e){}
    };
  });

  function langName(){
    var m={hi:"हिन्दी",en:"English",pa:"Punjabi",gu:"Gujarati",mr:"Marathi",bn:"Bengali",ta:"Tamil",te:"Telugu"};
    return m[lang]||lang;
  }

  async function callGroq(system,user){
    var k=keys().groq; if(!k) throw new Error("Groq key नहीं");
    var models=["llama-3.3-70b-versatile","llama-3.1-8b-instant","gemma2-9b-it"];
    var lastErr="Groq fail";
    for(var i=0;i<models.length;i++){
      try{
        var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
          body:JSON.stringify({model:models[i],temperature:0.7,max_tokens:2048,messages:[{role:"system",content:system},{role:"user",content:user}]})
        });
        var j=await r.json();
        if(!r.ok){lastErr=(j.error&&j.error.message)||("Groq "+r.status);continue;}
        var t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
        if(t&&t.trim()) return t.trim();
      }catch(e){lastErr=String(e.message||e);}
    }
    throw new Error(lastErr);
  }

  async function callOpenRouter(system,user){
    var k=keys().or; if(!k) throw new Error("OpenRouter key नहीं");
    var r=await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
      body:JSON.stringify({model:"openrouter/free",temperature:0.7,max_tokens:2048,messages:[{role:"system",content:system},{role:"user",content:user}]})
    });
    var j=await r.json();
    if(!r.ok) throw new Error((j.error&&j.error.message)||("OR "+r.status));
    var t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!t||!t.trim()) throw new Error("OR empty");
    return t.trim();
  }

  async function callGemini(system,user){
    var k=keys().gemini; if(!k) throw new Error("Gemini key नहीं");
    var url="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(k);
    var r=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:system+"\n\n"+user}]}],generationConfig:{temperature:0.7,maxOutputTokens:2048}})
    });
    var j=await r.json();
    if(!r.ok) throw new Error((j.error&&j.error.message)||("Gemini "+r.status));
    var t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text;
    if(!t||!t.trim()) throw new Error("Gemini empty");
    return t.trim();
  }

  async function callAI(system,user){
    var errs=[];
    try{return await callGroq(system,user);}catch(e){errs.push("Groq: "+e.message);}
    try{return await callOpenRouter(system,user);}catch(e){errs.push("OR: "+e.message);}
    try{return await callGemini(system,user);}catch(e){errs.push("Gemini: "+e.message);}
    throw new Error(errs.join(" | ")||"कोई AI key काम नहीं की · api.html चेक करो");
  }

  function parseScenes(text){
    var lines=String(text).split(/\n+/), out=[], buf="";
    for(var i=0;i<lines.length;i++){
      var ln=lines[i].trim();
      if(!ln) continue;
      if(/^(scene|सीन|Scene)\s*\d+/i.test(ln) || /^\d+[\.\)]\s+/.test(ln)){
        if(buf) out.push(buf.trim());
        buf=ln.replace(/^(scene|सीन|Scene)\s*\d+[:\.\-\s]*/i,"").replace(/^\d+[\.\)]\s*/,"");
      } else buf+=(buf?" ":"")+ln;
    }
    if(buf) out.push(buf.trim());
    if(out.length<2){
      var parts=String(text).split(/[\n]+/).filter(function(x){return x.trim().length>20;});
      if(parts.length>=2) out=parts.slice(0,6);
    }
    return out.slice(0,6);
  }

  function showScenes(arr){
    var box=document.getElementById("scenesList");
    var card=document.getElementById("scenesCard");
    box.innerHTML="";
    arr.forEach(function(s,i){
      var d=document.createElement("div");
      d.className="scene";
      d.innerHTML="<b>सीन "+(i+1)+"</b><p></p>";
      d.querySelector("p").textContent=s;
      box.appendChild(d);
    });
    card.style.display=arr.length?"block":"none";
  }

  async function runStoryAI(){
    var topic=(document.getElementById("storyInput").value||"").trim();
    var err=document.getElementById("storyErr");
    err.textContent="";
    if(!topic){err.textContent="पहले कहानी / विषय लिखो";return;}
    var k=keys();
    if(!k.groq&&!k.gemini&&!k.or){err.textContent="API key नहीं · home → Profile → API Keys / api.html";return;}

    document.getElementById("btnNext").disabled=true;
    setProg(true,15,"Story लिख रहे हैं…");
    try{
      var system="You are Velorix AI story writer for short vertical videos. Write a complete short story in language: "+langName()+" ("+lang+"). Style hint: "+style+". Keep under \~1 minute spoken length. Clear beginning, middle, end. No markdown fences.";
      var user="Topic / draft:\n"+topic+"\n\nWrite the full story only in "+langName()+".";
      var story=await callAI(system,user);
      setProg(true,55,"Scenes बना रहे हैं…");
      lastStory=story;
      document.getElementById("storyInput").value=story;

      var sys2="Split the story into 4 to 6 short scenes for a video. Language: "+langName()+". Each line: Scene N: one or two sentences. Aspect ratio will be "+size+". Output only scene lines.";
      var scenesText=await callAI(sys2,story);
      lastScenes=parseScenes(scenesText);
      if(!lastScenes.length) lastScenes=[story.slice(0,180)];
      showScenes(lastScenes);

      try{
        localStorage.setItem("VX_PROMPT",story);
        localStorage.setItem("VX_STORY",story);
        localStorage.setItem("VX_SCENES",JSON.stringify(lastScenes));
        localStorage.setItem("VX_SIZE",size);
        localStorage.setItem("VX_STYLE",style);
        localStorage.setItem("VX_CREATE_STEP","scenes_done");
      }catch(e){}

      setProg(true,100,"हो गया");
      document.getElementById("btnNext").textContent="अगला · Photos (PART 3)";
    }catch(e){
      err.textContent=String(e.message||e);
    }finally{
      setProg(false);
      document.getElementById("btnNext").disabled=false;
    }
  }

  /* gallery */
  function loadGallery(){
    var list=[];
    try{list=JSON.parse(localStorage.getItem("VX_GALLERY")||"[]");}catch(e){list=[];}
    var grid=document.getElementById("galGrid");
    grid.innerHTML="";
    if(!list.length){grid.innerHTML='<div class="gal-empty">अभी कोई फोटो नहीं · AI फोटो PART 3</div>';return;}
    list.forEach(function(item){
      var d=document.createElement("div");
      d.className="gal-thumb";
      d.innerHTML='<img alt="">';
      d.querySelector("img").src=item.thumb||item.url;
      d.onclick=function(){openViewer(item);};
      grid.appendChild(d);
    });
  }
  function openViewer(item){
    currentPhoto=item;
    document.getElementById("viewerImg").src=item.url||item.thumb;
    document.getElementById("viewerTitle").textContent=item.title||"Photo";
    document.getElementById("viewer").classList.add("on");
  }
  document.getElementById("btnViewerBack").onclick=function(){document.getElementById("viewer").classList.remove("on");};
  document.getElementById("btnDownload").onclick=function(){
    if(!currentPhoto)return;
    var a=document.createElement("a");
    a.href=currentPhoto.url||currentPhoto.thumb;
    a.download="velorix-"+(currentPhoto.id||Date.now())+".jpg";
    a.target="_blank";document.body.appendChild(a);a.click();a.remove();
  };
  document.getElementById("btnEdit").onclick=function(){document.getElementById("editSheet").classList.add("on");};
  document.getElementById("btnEditCancel").onclick=function(){document.getElementById("editSheet").classList.remove("on");};
  document.getElementById("btnEditGo").onclick=function(){
    var t=(document.getElementById("editPrompt").value||"").trim();
    if(!t){alert("लिखो क्या बदलना है");return;}
    try{localStorage.setItem("VX_EDIT_PENDING",JSON.stringify({id:currentPhoto&&currentPhoto.id,prompt:t}));}catch(e){}
    document.getElementById("editSheet").classList.remove("on");
    alert("Edit queue · AI PART 3");
  };
  document.getElementById("btnPickPhone").onclick=function(){document.getElementById("filePick").click();};
  document.getElementById("filePick").onchange=function(ev){
    var files=ev.target.files;if(!files||!files.length)return;
    var list=[];try{list=JSON.parse(localStorage.getItem("VX_GALLERY")||"[]");}catch(e){list=[];}
    var i=0;
    function next(){
      if(i>=files.length){try{localStorage.setItem("VX_GALLERY",JSON.stringify(list.slice(0,60)));}catch(e){}loadGallery();return;}
      var f=files[i++];var r=new FileReader();
      r.onload=function(){list.unshift({id:"loc_"+Date.now()+"_"+i,thumb:r.result,url:r.result,title:f.name||"Phone",source:"phone",size:size,style:style,ts:Date.now()});next();};
      r.readAsDataURL(f);
    }
    next();
  };

  document.getElementById("btnBackHome").onclick=function(){location.href="home.html";};
  document.getElementById("btnSaveDraft").onclick=function(){
    try{
      localStorage.setItem("VX_PROMPT",document.getElementById("storyInput").value||"");
      localStorage.setItem("VX_SIZE",size);localStorage.setItem("VX_STYLE",style);
    }catch(e){}
    alert("Draft save");
  };
  document.getElementById("btnNext").onclick=function(){
    if(lastScenes.length&&document.getElementById("btnNext").textContent.indexOf("PART 3")>=0){
      alert("PART 3 में रियल AI फोटो + gallery add");
      return;
    }
    runStoryAI();
  };

  try{
    var sc=JSON.parse(localStorage.getItem("VX_SCENES")||"[]");
    if(sc&&sc.length){lastScenes=sc;showScenes(sc);document.getElementById("btnNext").textContent="अगला · Photos (PART 3)";}
    var st=localStorage.getItem("VX_STORY");
    if(st) {lastStory=st;document.getElementById("storyInput").value=st;}
  }cat
