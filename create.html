<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create · Velorix AI</title>
<style>
:root{
  --bg:#0a0712;--bg2:#120c1c;--card:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08);--p:#a855f7;--p2:#7c3aed;--p3:#c084fc;
  --text:#faf5ff;--muted:#9b92ad;--ok:#34d399;--danger:#f87171;
  --r:18px;--shadow:0 12px 40px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(120% 80% at 50% -10%,#2a1548 0%,var(--bg) 55%)}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(16px);background:rgba(10,7,18,.75);z-index:30}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.top h1{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#fff,var(--p3));-webkit-background-clip:text;color:transparent}
.pill{font-size:11px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 120px}
.hero{margin-bottom:14px}
.hero p{font-size:13px;color:var(--muted);line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.input{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);padding:14px;font-size:15px;line-height:1.55;resize:vertical}
.input:focus{outline:none;border-color:rgba(168,85,247,.55);box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.story-view{display:none;white-space:pre-wrap;font-size:15px;line-height:1.6;color:#f3e8ff}
.story-view.on{display:block}
.err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px 16px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-main{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 28px rgba(124,58,237,.35)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,7,18,.96) 30%);display:flex;gap:10px;z-index:40}
/* progress */
.prog{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,4,12,.82);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;gap:16px}
.prog.on{display:flex}
.prog-ring{width:56px;height:56px;border-radius:50%;border:3px solid rgba(168,85,247,.2);border-top-color:var(--p);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-bar{width:70%;max-width:280px;height:6px;border-radius:99px;background:#1f1830;overflow:hidden}
.prog-bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--p),var(--p3));transition:width .35s ease}
.prog-text{font-size:13px;color:#ddd}
/* edit sheet */
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:110;background:#140f1c;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);box-shadow:var(--shadow)}
.sheet.on{display:block}
.sheet h3{font-size:15px;margin-bottom:8px}
.sheet textarea{width:100%;min-height:88px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;padding:12px;font-size:14px;resize:none}
.sheet .actions{margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" type="button" id="btnBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Velorix AI</h1>
    <span class="pill" id="langPill">HI</span>
  </div>

  <div class="main">
    <div class="hero">
      <p id="heroText">विषय लिखो · AI पूरी short-video स्टोरी बनाएगा</p>
    </div>

    <div class="card" id="inputCard">
      <div class="label">Story · विषय</div>
      <textarea class="input" id="topicInput" placeholder="जैसे: गरीब किसान की शाम की कहानी…"></textarea>
      <p class="err" id="errBox"></p>
      <p class="hint">भाषा index से आती है · Size / Quality बाद में (Characters से पहले)</p>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="label">Generated Story</div>
      <div class="story-view on" id="storyView"></div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" id="btnEdit">Edit</button>
        <button class="btn btn-main" type="button" id="btnToScenes">Continue → Scenes</button>
      </div>
    </div>
  </div>

  <div class="bottom" id="bottomBar">
    <button class="btn btn-ghost" type="button" id="btnDraft">Draft</button>
    <button class="btn btn-main" type="button" id="btnCreate">Create Story</button>
  </div>
</div>

<div class="prog" id="prog">
  <div class="prog-ring"></div>
  <div class="prog-bar"><i id="progBar"></i></div>
  <p class="prog-text" id="progText">Story बन रही है…</p>
</div>

<div class="sheet" id="editSheet">
  <h3>Story Edit</h3>
  <p class="hint">छोटा सुझाव लिखो — AI उसी हिसाब से स्टोरी बदलेगा</p>
  <textarea id="editInput" placeholder="जैसे: अंत खुशहाल करो, किसान का नाम राम रखो…"></textarea>
  <div class="actions">
    <button class="btn btn-ghost" type="button" id="btnEditCancel">Cancel</button>
    <button class="btn btn-main" type="button" id="btnEditApply">Apply Edit</button>
  </div>
</div>

<script>
/* === CREATE PART 1 · Story first · premium shell · PART 2 neeche === */
var VX = {
  lang: (localStorage.getItem("velorix_lang") || localStorage.getItem("VX_LANG") || "hi").toLowerCase(),
  story: "",
  step: "topic"
};
document.getElementById("langPill").textContent = VX.lang.toUpperCase();
/* boot: home से prompt · पुरानी story auto-open नहीं */
  try {
    var q = new URLSearchParams(location.search).get("q");
    var p = q || localStorage.getItem("VX_PROMPT") || "";
    if (q) {
      /* Home से नया विषय = पुरानी story/scenes हटाओ */
      try {
        localStorage.removeItem("VX_STORY");
        localStorage.removeItem("VX_SCENES");
        localStorage.removeItem("VX_SCENE_PACK");
        localStorage.removeItem("VX_CREATE_STEP");
      } catch (e1) {}
      VX.story = "";
      VX.scenes = [];
      VX.scenePack = [];
    }
    if (p && document.getElementById("topicInput")) {
      document.getElementById("topicInput").value = p;
    }
    /* result card शुरू में बंद · सिर्फ Create Story से खुले */
    var rc = document.getElementById("resultCard");
    if (rc) {
      rc.style.display = "none";
      rc.classList.remove("on");
    }
    var ic = document.getElementById("inputCard");
    if (ic) ic.style.display = "block";
    var bb = document.getElementById("bottomBar");
    if (bb) bb.style.display = "flex";
  } catch (e) {}
function vxShowResult(text) {
  VX.story = text;
  VX.step = "story";
  document.getElementById("storyView").textContent = text;
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("inputCard").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";
  document.getElementById("heroText").textContent = "Edit करो या Scenes पर जाओ";
}

function vxSetProg(on, pct, msg) {
  var el = document.getElementById("prog");
  if (on) {
    el.classList.add("on");
    document.getElementById("progBar").style.width = (pct || 12) + "%";
    document.getElementById("progText").textContent = msg || "…";
  } else el.classList.remove("on");
}

document.getElementById("btnBack").onclick = function () {
  if (VX.step === "story") {
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("inputCard").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    document.getElementById("heroText").textContent = "विषय लिखो · AI पूरी short-video स्टोरी बनाएगा";
    VX.step = "topic";
    return;
  }
  location.href = "home.html";
};

document.getElementById("btnDraft").onclick = function () {
  try {
    localStorage.setItem("VX_PROMPT", document.getElementById("topicInput").value || "");
  } catch (e) {}
  alert("Draft save हो गया");
};

document.getElementById("btnEdit").onclick = function () {
  document.getElementById("editInput").value = "";
  document.getElementById("editSheet").classList.add("on");
};
document.getElementById("btnEditCancel").onclick = function () {
  document.getElementById("editSheet").classList.remove("on");
};

/* Create / Edit AI — PART 2 में real API; यहाँ safe placeholder hook */
document.getElementById("btnCreate").onclick = function () {
  if (typeof vxRunStoryAI === "function") {
    vxRunStoryAI();
    return;
  }
  var t = (document.getElementById("topicInput").value || "").trim();
  document.getElementById("errBox").textContent = "";
  if (!t) {
    document.getElementById("errBox").textContent = "पहले विषय लिखो";
    return;
  }
  alert("PART 2 लगाओ · Story AI + बैंगनी progress");
};

document.getElementById("btnEditApply").onclick = function () {
  if (typeof vxRunStoryEdit === "function") {
    vxRunStoryEdit();
    return;
  }
  try {
    localStorage.setItem("VX_STORY", VX.story || "");
    localStorage.setItem("VX_CREATE_STEP", "scenes");
  } catch (e) {}
  alert("PART 2 · Scenes + Size स्क्रीन");
};
/* === CREATE PART 2 FINAL · models + premium small loader + full story === */
/* === CREATE PART 2 FINAL · story · scenes · size · consistency === */
(function () {
  var s = document.createElement("style");
  s.textContent = [
    "#resultCard{display:none!important;flex-direction:column;flex:1;min-height:0;padding:0!important;border:none!important;background:transparent!important;box-shadow:none!important}",
    "#resultCard.on{display:flex!important}",
    ".story-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 2px 14px;min-height:50vh}",
    ".story-body{font-size:16px;line-height:1.75;color:#f5f0ff;white-space:pre-wrap}",
    ".scenes-wrap{margin-top:18px}",
    ".scene-card{background:rgba(255,255,255,.05);border:1px solid rgba(168,85,247,.18);border-radius:16px;padding:14px;margin-bottom:10px}",
    ".scene-card .sn{font-size:11px;font-weight:700;color:#c084fc;letter-spacing:.07em}",
    ".scene-card .st{margin:8px 0;font-size:14px;line-height:1.55;color:#efe8ff}",
    ".scene-card .pr{font-size:11px;color:#b8a0e8;line-height:1.45;margin-top:6px}",
    ".scene-card .pr b{color:#ddd6fe}",
    ".result-bottom{flex-shrink:0;display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,7,18,.98) 30%)}",
    ".prog{background:rgba(6,4,12,.92)!important;backdrop-filter:blur(14px)}",
    ".prog-ring{display:none!important}",
    ".prog-wrap{width:52%;max-width:200px;text-align:center}",
    ".prog-pct{font-size:20px;font-weight:800;color:#faf5ff;margin-bottom:8px}",
    ".prog-bar{height:5px!important;border-radius:99px;background:#140c24!important;border:1px solid rgba(168,85,247,.35)!important;overflow:hidden}",
    ".prog-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c084fc)!important;transition:width .2s ease}",
    ".prog-text{margin-top:8px;font-size:11px;font-weight:600;color:#c4b5fd}",
    "#editStoryPreview{max-height:26vh;overflow:auto;font-size:13px;line-height:1.5;color:#e9e4f5;margin:0 0 10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.4);white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)}",
    "#sizeScreen{display:none;padding:8px 0 100px}",
    "#sizeScreen.on{display:block}",
    ".size-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}",
    ".size-chip{padding:14px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);text-align:center;font-size:13px;font-weight:600;color:#e9e4f5;cursor:pointer}",
    ".size-chip.on{border-color:rgba(168,85,247,.65);background:rgba(124,58,237,.2);color:#fff}",
    ".q-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}",
    ".q-chip{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font-size:12px;color:#ccc;cursor:pointer}",
    ".q-chip.on{border-color:#a855f7;background:rgba(168,85,247,.2);color:#fff}"
  ].join("");
  document.head.appendChild(s);

  var prog = document.getElementById("prog");
  if (prog) {
    prog.innerHTML = '<div class="prog-wrap"><div class="prog-pct" id="progPct">0%</div><div class="prog-bar"><i id="progBar"></i></div><p class="prog-text" id="progText">…</p></div>';
  }

  var rc = document.getElementById("resultCard");
  if (rc) {
    rc.innerHTML =
      '<div class="story-scroll" id="storyScroll">' +
      '<div class="label" id="resultLabel">GENERATED STORY</div>' +
      '<div class="story-body" id="storyView"></div>' +
      '<div class="scenes-wrap" id="scenesBlock" style="display:none"></div></div>' +
      '<div class="result-bottom" id="resultBottom">' +
      '<button class="btn btn-ghost" type="button" id="btnEdit">Edit</button>' +
      '<button class="btn btn-main" type="button" id="btnToScenes">Continue → Scenes</button></div>';
  }

  /* Size screen — same page, no stuck message */
  if (!document.getElementById("sizeScreen")) {
    var main = document.querySelector(".main") || document.body;
    var sz = document.createElement("div");
    sz.id = "sizeScreen";
    sz.innerHTML =
      '<div class="card" style="margin-top:8px">' +
      '<div class="label">VIDEO SIZE</div>' +
      '<div class="size-grid" id="sizeGrid">' +
      '<div class="size-chip on" data-s="9:16">9:16 · Reels / Shorts</div>' +
      '<div class="size-chip" data-s="16:9">16:9 · YouTube</div>' +
      '<div class="size-chip" data-s="1:1">1:1 · Square</div>' +
      '<div class="size-chip" data-s="4:5">4:5 · Feed</div></div>' +
      '<div class="label">QUALITY</div>' +
      '<div class="q-row" id="qualRow">' +
      '<span class="q-chip on" data-q="hd">HD Mix</span>' +
      '<span class="q-chip" data-q="3d">3D</span>' +
      '<span class="q-chip" data-q="2d">2D</span>' +
      '<span class="q-chip" data-q="real">Real</span></div>' +
      '<button class="btn btn-main" type="button" id="btnSizeNext" style="width:100%">Continue → Characters</button></div>';
    main.appendChild(sz);
  }
})();

VX.scenes = VX.scenes || [];
VX.scenePack = VX.scenePack || [];
VX.size = localStorage.getItem("VX_SIZE") || "9:16";
VX.quality = localStorage.getItem("VX_QUALITY") || "hd";
VX.MAX_STORY_CHARS = 900;
VX.MIN_STORY_CHARS = 80;
VX._progTimer = null;
VX._progVal = 0;

function vxKeys() {
  return {
    groq: (localStorage.getItem("VX_GROQ") || "").trim(),
    gemini: (localStorage.getItem("VX_GEMINI") || "").trim(),
    or: (localStorage.getItem("VX_OR") || "").trim()
  };
}
function vxLangName() {
  var m = { hi: "हिन्दी", en: "English", ta: "Tamil", te: "Telugu", pa: "Punjabi", gu: "Gujarati", bn: "Bengali", mr: "Marathi", kn: "Kannada", ml: "Malayalam", or: "Odia", ur: "Urdu", es: "Spanish", fr: "French", de: "German", ar: "Arabic", pt: "Portuguese", zh: "Chinese", ja: "Japanese", ru: "Russian" };
  return m[VX.lang] || VX.lang;
}
function vxLooksLikeFullStory(t) {
  t = (t || "").trim();
  return t.length >= 160 || (((t.match(/[.।!?\n]/g) || []).length >= 3) && t.length >= 120);
}
function vxIsBadStory(t) {
  t = (t || "").trim();
  if (t.length < VX.MIN_STORY_CHARS) return true;
  if (/user\s*safety/i.test(t) || /^safe\.?$/i.test(t)) return true;
  return false;
}
function vxTrimToMinute(t) {
  t = (t || "").trim();
  if (t.length <= VX.MAX_STORY_CHARS) return t;
  var cut = t.slice(0, VX.MAX_STORY_CHARS);
  var i = Math.max(cut.lastIndexOf("।"), cut.lastIndexOf("."), cut.lastIndexOf("\n"));
  if (i > 200) cut = cut.slice(0, i + 1);
  return cut.trim();
}

function vxSetProg(on, pct, msg) {
  var el = document.getElementById("prog");
  if (!el) return;
  if (VX._progTimer) { clearInterval(VX._progTimer); VX._progTimer = null; }
  if (!on) { el.classList.remove("on"); VX._progVal = 0; return; }
  el.classList.add("on");
  VX._progVal = Math.max(1, Math.min(99, pct || 1));
  var bar = document.getElementById("progBar");
  var p = document.getElementById("progPct");
  var t = document.getElementById("progText");
  if (bar) bar.style.width = VX._progVal + "%";
  if (p) p.textContent = VX._progVal + "%";
  if (t) t.textContent = msg || "…";
  VX._progTimer = setInterval(function () {
    if (VX._progVal >= 90) return;
    VX._progVal += 1;
    if (bar) bar.style.width = VX._progVal + "%";
    if (p) p.textContent = VX._progVal + "%";
  }, 300);
}

async function vxFetchJson(url, opt, ms) {
  ms = ms || 40000;
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
  try {
    var o = opt || {};
    if (ctrl) o.signal = ctrl.signal;
    var r = await fetch(url, o);
    var j = await r.json().catch(function () { return {}; });
    return { r: r, j: j };
  } finally { clearTimeout(timer); }
}

async function vxCallGroq(system, user) {
  var k = vxKeys().groq;
  if (!k) throw new Error("Groq key नहीं");
  var models = ["llama-3.1-8b-instant", "llama-3.3-70b-versatile", "openai/gpt-oss-20b"];
  var last = "Groq fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var res = await vxFetchJson("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
        body: JSON.stringify({
          model: models[i], temperature: 0.7, max_tokens: 1400,
          messages: [{ role: "system", content: system }, { role: "user", content: user }]
        })
      }, 35000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("Groq " + res.r.status); continue; }
      var t = res.j.choices && res.j.choices[0] && res.j.choices[0].message && res.j.choices[0].message.content;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "Groq bad";
    } catch (e) { last = /abort/i.test(String(e)) ? "timeout" : String(e.message || e); }
  }
  throw new Error(last);
}
async function vxCallOR(system, user) {
  var k = vxKeys().or;
  if (!k) throw new Error("OpenRouter key नहीं");
  var models = ["openrouter/free", "meta-llama/llama-3.3-70b-instruct:free"];
  var last = "OR fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var res = await vxFetchJson("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
        body: JSON.stringify({
          model: models[i], temperature: 0.7, max_tokens: 1400,
          messages: [{ role: "system", content: system }, { role: "user", content: user }]
        })
      }, 40000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("OR " + res.r.status); continue; }
      var t = res.j.choices && res.j.choices[0] && res.j.choices[0].message && res.j.choices[0].message.content;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "OR empty";
    } catch (e) { last = String(e.message || e); }
  }
  throw new Error(last);
}
async function vxCallGemini(system, user) {
  var k = vxKeys().gemini;
  if (!k) throw new Error("Gemini key नहीं");
  var models = ["gemini-2.5-flash", "gemini-3.8-flash", "gemini-flash-latest"];
  var last = "Gemini fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + models[i] + ":generateContent?key=" + encodeURIComponent(k);
      var res = await vxFetchJson(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: system + "\n\n" + user }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 1400 }
        })
      }, 40000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("Gemini " + res.r.status); continue; }
      var t = res.j.candidates && res.j.candidates[0] && res.j.candidates[0].content &&
        res.j.candidates[0].content.parts && res.j.candidates[0].content.parts[0] &&
        res.j.candidates[0].content.parts[0].text;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "Gemini empty";
    } catch (e) { last = String(e.message || e); }
  }
  throw new Error(last);
}
async function vxCallAI(system, user) {
  var errs = [];
  try { return await vxCallGroq(system, user); } catch (e) { errs.push(e.message); }
  try { return await vxCallOR(system, user); } catch (e) { errs.push(e.message); }
  try { return await vxCallGemini(system, user); } catch (e) { errs.push(e.message); }
  throw new Error(errs.join(" | "));
}

function vxParseScenePack(raw) {
  var pack = [];
  try {
    var m = String(raw).match(/\[[\s\S]*\]/);
    if (m) {
      var arr = JSON.parse(m[0]);
      if (Array.isArray(arr)) {
        arr.forEach(function (o, i) {
          pack.push({
            n: i + 1,
            text: String(o.text || o.scene || o.dialogue || "").trim(),
            photo: String(o.photo_prompt || o.photo || "").trim(),
            video: String(o.video_prompt || o.video || "").trim()
          });
        });
      }
    }
  } catch (e) {}
  if (!pack.length) {
    String(raw).split(/\n+/).forEach(function (ln) {
      ln = ln.trim();
      if (!ln) return;
      if (/^(scene|सीन)\s*\d+/i.test(ln) || /^\d+[\.\)]/.test(ln)) {
        pack.push({
          n: pack.length + 1,
          text: ln.replace(/^(scene|सीन)\s*\d+[:\.\-\s]*/i, "").replace(/^\d+[\.\)]\s*/, ""),
          photo: "", video: ""
        });
      }
    });
  }
  return pack.slice(0, 6);
}

      a.rel = "noopener";

      if (ent.locked) { alert("Lock है · पहले Unlock करो"); return; }

    card.querySelector('[data-act="gal"]').onclick = function () {

/* Image keys — API Center से; PART 4 में full wire */
window.vxGetImageKeys = function () {
  var out = [];
  var names = ["VX_IMAGE_KEYS", "VX_IMG_KEYS", "velorix_image_keys", "VX_API_IMAGE"];
  for (var i = 0; i < names.length; i++) {
    try {
      var raw = localStorage.getItem(names[i]);
      if (!raw) continue;
      var j = JSON.parse(raw);
      if (Array.isArray(j)) out = j;
      else if (j && typeof j === "object") {
        Object.keys(j).forEach(function (k) {
          out.push({ name: k, key: j[k] });
        });
      }
      if (out.length) break;
    } catch (e) {}
  }
  /* single keys optional */
  ["VX_REPLICATE", "VX_FAL", "VX_TOGETHER"].forEach(function (k) {
    try {
      var v = localStorage.getItem(k);
      if (v && v.length > 8) out.push({ name: k.replace("VX_", ""), key: v });
    } catch (e2) {}
  });
  return out.filter(function (x) { return x && x.key; });
};

/* Better names from story */
window.vxGuessCharsFromStory = function () {
  var ctx = vxStoryContext();
  var blob = ctx.blob || "";
  var found = [];
  var seen = {};
  function add(n) {
    n = (n || "").trim();
    if (!n || seen[n]) return;
    seen[n] = 1;
    found.push(n);
  }
  /* English proper-ish */
  var m;
  var re = /\b([A-Z][a-z]{2,}(?:\s+[A-Z][a-z]+)?)\b/g;
  while ((m = re.exec(blob)) && found.length < 6) {
    if (!/^(The|And|But|For|With|From|This|That|When|After|Scene)$/.test(m[1])) add(m[1]);
  }
  /* Hindi common roles */
  ["रामू", "रामु", "किसान", "पत्नी", "बीवी", "बच्चे", "बच्चा", "व्यापारी", "अधिकारी", "Ramu", "Farmer", "Wife", "Children", "Trader", "Official"].forEach(function (c) {
    if (blob.indexOf(c) >= 0) add(c);
  });
  if (!found.length) found = ["मुख्य पात्र", "सह पात्र"];
  if (found.length > 5) found = found.slice(0, 5);
  return found.map(function (n, i) {
    return {
      id: "c" + i,
      name: n,
      type: "char",
      url: "",
      locked: false,
      prompt: n + " character from the story, consistent face clothes age"
    };
  });
};

window.vxGuessBgs = function () {
  var ctx = vxStoryContext();
  var blob = (ctx.blob || "").toLowerCase();
  var list = [];
  function bg(name, prompt) {
    list.push({ id: "b" + list.length, name: name, type: "bg", url: "", locked: false, prompt: prompt });
  }
  bg("गाँव / घर", "rural indian village house courtyard cinematic");
  bg("खेत", "farm field crops indian countryside cinematic");
  if (/बाजार|market|shop|व्याप/.test(blob)) bg("बाजार", "village market street cinematic");
  else bg("रास्ता / बाहर", "village path dusty road cinematic");
  return list.slice(0, 4);
};

/* Override gen to use improved URL + progress */
window.vxGenEntityImage = function (list, idx, gridId) {
  var ent = list[idx];
  if (!ent) return;
  if (ent.locked) { alert("Lock है · पहले Unlock"); return; }
  if (typeof vxSetProg === "function") vxSetProg(true, 15, "Photo · " + (ent.name || ""));
  var url = vxBuildImageUrl(ent.prompt || ent.name, ent);
  var img = new Image();
  var done = false;
  function finish(ok) {
    if (done) return;
    done = true;
    if (typeof vxSetProg === "function") vxSetProg(false);
    if (!ok) {
      alert("Photo load fail · फिर AI दबाओ");
      return;
    }
    ent.url = url;
    if (typeof vxGallerySave === "function") {
      vxGallerySave({
        id: "g_" + Date.now(),
        url: url,
        name: ent.name,
        type: ent.type,
        best: true,
        ts: Date.now(),
        storyBit: (vxStoryContext().story || "").slice(0, 80)
      });
    }
    try {
      localStorage.setItem("VX_CHARS", JSON.stringify(VX.chars || []));
      localStorage.setItem("VX_BGS", JSON.stringify(VX.bgs || []));
    } catch (e) {}
    if (typeof vxRenderEntityGrid === "function") vxRenderEntityGrid(gridId, list);
  }
  img.onload = function () { finish(true); };
  img.onerror = function () { finish(false); };
  setTimeout(function () { if (!done) finish(false); }, 45000);
  img.src = url;
  /* PART 4: var keys = vxGetImageKeys(); if (keys.length) { ... Replicate/fal/Together ... } */
};

window.vxClearOnePhoto = function (list, idx, gridId) {
  if (!list || !list[idx]) return;
  list[idx].url = "";
  list[idx].locked = false;
  try {
    localStorage.setItem("VX_CHARS", JSON.stringify((VX && VX.chars) || []));
    localStorage.setItem("VX_BGS", JSON.stringify((VX && VX.bgs) || []));
  } catch (e) {}
  if (typeof vxRenderEntityGrid === "function") vxRenderEntityGrid(gridId, list);
};

/* wrap render — trash button + has-photo class */
(function () {
  var prevRender = window.vxRenderEntityGrid;
  if (typeof prevRender !== "function") return;
  window.vxRenderEntityGrid = function (gridId, list) {
    prevRender(gridId, list);
    var grid = document.getElementById(gridId);
    if (!grid || !list) return;
    var cards = grid.querySelectorAll(".char-card");
    for (var i = 0; i < cards.length; i++) {
      (function (card, idx) {
        var ent = list[idx];
        if (!ent) return;
        if (ent.url) card.classList.add("has-photo");
        else card.classList.remove("has-photo");
        var prev = card.querySelector(".char-preview");
        if (!prev) return;
        var tr = prev.querySelector(".char-trash");
        if (!tr) {
          tr = document.createElement("button");
          tr.type = "button";
          tr.className = "char-trash";
          tr.title = "Photo हटाओ";
          tr.textContent = "🗑";
          prev.appendChild(tr);
        }
        tr.onclick = function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (ent.locked) {
            if (!confirm("Lock है · फिर भी photo हटाएँ?")) return;
          }
          vxClearOnePhoto(list, idx, gridId);
        };
      })(cards[i], i);
    }
  };
})();

/* when characters screen opens — sync story id */
(function () {
  var prevShow = window.vxShowCharactersScreen;
  window.vxShowCharactersScreen = function () {
    try { vxResetCharsForNewStory(); } catch (e) {}
    if (typeof prevShow === "function") prevShow();
    else {
      VX.step = "chars";
      var ch = document.getElementById("charScreen");
      if (ch) { ch.style.display = "block"; ch.classList.add("on"); }
      if (typeof vxRenderEntityGrid === "function") {
        vxRenderEntityGrid("charGrid", VX.chars || []);
        vxRenderEntityGrid("bgGrid", VX.bgs || []);
      }
    }
  };
})();

/* after story is saved — mark new story id (call-safe) */
window.vxOnStoryReady = function () {
  try {
    var sid = vxCurrentStoryId();
    var prev = localStorage.getItem("VX_STORY_ID") || "";
    if (prev !== sid) {
      localStorage.setItem("VX_STORY_ID", sid);
      if (window.VX) {
        VX.chars = (typeof vxGuessCharsFromStory === "function") ? vxGuessCharsFromStory() : [];
        VX.bgs = (typeof vxGuessBgs === "function") ? vxGuessBgs() : [];
      }
      localStorage.setItem("VX_CHARS", JSON.stringify((VX && VX.chars) || []));
      localStorage.setItem("VX_BGS", JSON.stringify((VX && VX.bgs) || []));
    }
  } catch (e) {}
};

/* hook common story save points if they set VX.story */
(function () {
  if (!window.VX) window.VX = {};
  var _story = VX.story;
  try {
    Object.defineProperty(VX, "story", {
      get: function () { return _story; },
      set: function (v) {
        var old = _story;
        _story = v;
        try { localStorage.setItem("VX_STORY", v || ""); } catch (e) {}
        if (String(old || "") !== String(v || "")) {
          try { vxOnStoryReady(); } catch (e2) {}
        }
      },
      configurable: true
    });
  } catch (e3) {
    /* older browsers — manual: call vxOnStoryReady() after story gen */
  }
})();

/* === END PART 3.1.1 === */
/* === END PART 3 === */
  /* === CREATE PART 4 · 6 Image Keys wire · Replicate / fal / Together · fallback Pollinations === */
(function () {
  if (!window.VX) window.VX = {};

  /* ---- normalize keys from API Center / localStorage ---- */
  window.vxLoadImageKeySlots = function () {
    var slots = [];
    function add(name, key, provider) {
      key = String(key || "").trim();
      if (!key || key.length < 6) return;
      name = name || provider || "image";
      provider = (provider || vxDetectImageProvider(name, key)).toLowerCase();
      slots.push({ name: name, key: key, provider: provider });
    }
    function detectFromName(n) {
      n = String(n || "").toLowerCase();
      if (n.indexOf("repl") >= 0) return "replicate";
      if (n.indexOf("fal") >= 0) return "fal";
      if (n.indexOf("together") >= 0) return "together";
      return "unknown";
    }
    window.vxDetectImageProvider = function (name, key) {
      var d = detectFromName(name);
      if (d !== "unknown") return d;
      var k = String(key || "");
      if (k.indexOf("r8_") === 0) return "replicate";
      if (k.indexOf("fal_") >= 0 || k.length > 40 && name.toLowerCase().indexOf("fal") >= 0) return "fal";
      return detectFromName(name);
    };

    /* primary format */
  var primaryKeys = ["VX_IMG_FREE", "VX_IMAGE_KEYS", "VX_IMG_KEYS", "velorix_image_keys", "VX_API_IMAGE_KEYS", "VX_IMG_PREM"];
    for (var p = 0; p < primaryKeys.length; p++) {
      try {
        var raw = localStorage.getItem(primaryKeys[p]);
        if (!raw) continue;
        var j = JSON.parse(raw);
        if (Array.isArray(j)) {
          j.forEach(function (it) {
            if (typeof it === "string") add("img", it, "unknown");
            else add(it.name || it.provider, it.key || it.apiKey || it.token, it.provider);
          });
        } else if (j && typeof j === "object") {
          Object.keys(j).forEach(function (k) {
            var v = j[k];
            if (typeof v === "string") add(k, v, detectFromName(k));
            else if (v && v.key) add(v.name || k, v.key, v.provider || detectFromName(k));
          });
        }
      } catch (e) {}
      if (slots.length) break;
    }

    /* numbered slots Image 1..6 style */
    for (var i = 1; i <= 8; i++) {
      try {
        var nm = localStorage.getItem("VX_IMAGE_NAME_" + i) || localStorage.getItem("img_name_" + i);
        var ky = localStorage.getItem("VX_IMAGE_KEY_" + i) || localStorage.getItem("img_key_" + i);
        if (ky) add(nm || ("Image " + i), ky, detectFromName(nm));
      } catch (e2) {}
    }

    /* singles */
    [
      ["VX_REPLICATE", "replicate"],
      ["VX_REPLICATE_2", "replicate"],
      ["VX_FAL", "fal"],
      ["VX_FAL_2", "fal"],
      ["VX_TOGETHER", "together"],
      ["VX_TOGETHER_2", "together"]
    ].forEach(function (pair) {
      try {
        var v = localStorage.getItem(pair[0]);
        if (v) add(pair[0], v, pair[1]);
      } catch (e3) {}
    });

    /* de-dupe by key */
    var seen = {};
    var out = [];
    slots.forEach(function (s) {
      if (seen[s.key]) return;
      seen[s.key] = 1;
      out.push(s);
    });
    VX._imgSlots = out;
    return out;
  };

  window.vxGetImageKeys = function () {
    return vxLoadImageKeySlots();
  };

  /* save helper — API Center "Save Image Keys" से भी ये format लिखो */
  window.vxSaveImageKeySlots = function (arr) {
    try {
      localStorage.setItem("VX_IMAGE_KEYS", JSON.stringify(arr || []));
      VX._imgSlots = arr || [];
    } catch (e) {}
  };

  /* ---- prompt (story-aware) ---- */
  window.vxImagePromptFor = function (ent) {
    var ctx = (typeof vxStoryContext === "function") ? vxStoryContext() : { blob: (VX.story || ""), style: VX.style };
    var role = (ent && ent.name) || "character";
    var isBg = ent && ent.type === "bg";
    var style = (typeof vxStylePrompt === "function") ? vxStylePrompt() : "cinematic high quality";
    return [
      role,
      isBg ? "cinematic environment background, empty of random faces" : "character portrait, clear face, consistent identity, upper body",
      ent && ent.prompt ? ent.prompt : "",
      "story: " + String(ctx.blob || VX.story || "").slice(0, 260),
      style,
      "no watermark, high detail"
    ].filter(Boolean).join(", ");
  };

  /* ---- providers (browser best-effort; CORS हो तो next) ---- */
  window.vxImgGenTogether = function (slot, prompt) {
    return fetch("https://api.together.xyz/v1/images/generations", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + slot.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "black-forest-labs/FLUX.1-schnell-Free",
        prompt: prompt,
        width: 768,
        height: 1024,
        steps: 4,
        n: 1
      })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error && (j.error.message || j.error)) || ("Together " + r.status));
        var url = j.data && j.data[0] && (j.data[0].url || (j.data[0].b64_json ? ("data:image/png;base64," + j.data[0].b64_json) : ""));
        if (!url) throw new Error("Together empty");
        return url;
      });
    });
  };

  window.vxImgGenFal = function (slot, prompt) {
    /* fal queue API — may CORS in pure browser; fail → fallback */
    return fetch("https://fal.run/fal-ai/flux/schnell", {
      method: "POST",
      headers: {
        "Authorization": "Key " + slot.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt: prompt, image_size: "portrait_4_3", num_images: 1 })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.detail) || ("fal " + r.status));
        var url = j.images && j.images[0] && j.images[0].url;
        if (!url) throw new Error("fal empty");
        return url;
      });
    });
  };

  window.vxImgGenReplicate = function (slot, prompt) {
    /* create prediction */
    return fetch("https://api.replicate.com/v1/predictions", {
      method: "POST",
      headers: {
        "Authorization": "Token " + slot.key,
        "Content-Type": "application/json",
        "Prefer": "wait"
      },
      body: JSON.stringify({
        version: "black-forest-labs/flux-schnell",
        input: { prompt: prompt, num_outputs: 1, go_fast: true }
      })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.detail) || ("Replicate " + r.status));
        var out = j.output;
        if (Array.isArray(out) && out[0]) return out[0];
        if (typeof out === "string") return out;
        if (j.urls && j.urls.get) {
          return vxPollReplicate(slot.key, j.urls.get);
        }
        throw new Error("Replicate empty");
      });
    });
  };

  window.vxPollReplicate = function (key, url) {
    var tries = 0;
    function once() {
      return fetch(url, { headers: { "Authorization": "Token " + key } })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.status === "succeeded") {
            var out = j.output;
            if (Array.isArray(out) && out[0]) return out[0];
            if (typeof out === "string") return out;
            throw new Error("Replicate no output");
          }
          if (j.status === "failed" || j.status === "canceled") throw new Error("Replicate failed");
          tries++;
          if (tries > 40) throw new Error("Replicate timeout");
          return new Promise(function (res) { setTimeout(res, 1500); }).then(once);
        });
    }
    return once();
  };

  window.vxImgGenPollinations = function (prompt) {
    var w = 768, h = 1024;
    var sz = (VX.size || localStorage.getItem("VX_SIZE") || "9:16");
    if (String(sz).indexOf("16:9") >= 0) { w = 1280; h = 720; }
    var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
      "?width=" + w + "&height=" + h + "&nologo=true&seed=" + Math.floor(Math.random() * 1e9);
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var done = false;
      img.onload = function () { if (!done) { done = true; resolve(url); } };
      img.onerror = function () { if (!done) { done = true; reject(new Error("Pollinations fail")); } };
      setTimeout(function () { if (!done) { done = true; reject(new Error("Pollinations timeout")); } }, 40000);
      img.src = url;
    });
  };

  /* round-robin index */
  VX._imgRR = VX._imgRR || 0;

  window.vxGenerateImageSmart = function (ent, onProg) {
    var prompt = vxImagePromptFor(ent);
    var slots = vxLoadImageKeySlots();
    var order = slots.slice();
    /* rotate start for load balance */
    if (order.length) {
      var start = VX._imgRR % order.length;
      VX._imgRR++;
      order = order.slice(start).concat(order.slice(0, start));
    }

    function trySlot(i) {
      if (i >= order.length) {
        if (onProg) onProg(70, "Free fallback…");
        return vxImgGenPollinations(prompt);
      }
      var slot = order[i];
      if (onProg) onProg(20 + i * 10, (slot.provider || slot.name) + "…");
      var prov = slot.provider || "unknown";
if (prov === "unknown") {
  var kn = String(slot.key || "");
  var nm = String(slot.name || "").toLowerCase();
  if (kn.indexOf("r8_") === 0 || nm.indexOf("repl") >= 0) prov = "replicate";
  else if (nm.indexOf("fal") >= 0 || kn.indexOf("fal_") >= 0) prov = "fal";
  else if (nm.indexOf("together") >= 0 || kn.indexOf("tgp_") === 0) prov = "together";
}
function runProv(p) {
  if (p === "together") return vxImgGenTogether(slot, prompt);
  if (p === "fal") return vxImgGenFal(slot, prompt);
  if (p === "replicate") return vxImgGenReplicate(slot, prompt);
  return Promise.reject(new Error("unknown"));
}
/* unknown → तीनों try */
var job = (prov !== "unknown")
  ? runProv(prov)
  : runProv("together").catch(function () {
      return runProv("fal");
    }).catch(function () {
      return runProv("replicate");
    });
return job.catch(function () { return trySlot(i + 1); });

      if (!order.length) {
        if (onProg) onProg(50, "Free image…");
        return vxImgGenPollinations(prompt);
      }
      return trySlot(0);
    };

  /* override AI photo button path */
  window.vxGenEntityImage = function (list, idx, gridId) {
    var ent = list[idx];
    if (!ent) return;
    if (ent.locked) { alert("Lock है · पहले Unlock"); return; }
    if (typeof vxSetProg === "function") vxSetProg(true, 10, "Photo · " + (ent.name || ""));
    vxGenerateImageSmart(ent, function (pct, msg) {
      if (typeof vxSetProg === "function") vxSetProg(true, pct, msg || "Photo…");
    }).then(function (url) {
      ent.url = url;
      if (typeof vxGallerySave === "function") {
        vxGallerySave({
          id: "g_" + Date.now(),
          url: url,
          name: ent.name,
          type: ent.type || "char",
          best: true,
          ts: Date.now(),
          storyBit: String(VX.story || "").slice(0, 80)
        });
      }
      try {
        localStorage.setItem("VX_CHARS", JSON.stringify(VX.chars || []));
        localStorage.setItem("VX_BGS", JSON.stringify(VX.bgs || []));
      } catch (e) {}
      if (typeof vxSetProg === "function") vxSetProg(false);
      if (typeof vxRenderEntityGrid === "function") vxRenderEntityGrid(gridId, list);
    }).catch(function (err) {
      if (typeof vxSetProg === "function") vxSetProg(false);
      alert("Photo नहीं बनी: " + (err && err.message ? err.message : "retry"));
    });
  };

  /* optional: expose count for owner debug */
  window.vxImageKeysStatus = function () {
    var s = vxLoadImageKeySlots();
    return { count: s.length, providers: s.map(function (x) { return x.provider + ":" + x.name; }) };
  };
})();
/* === END PART 4 === */
