<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create · Velorix AI</title>
<style>
:root{--bg:#0d0a14;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.09);--p:#a855f7;--p2:#7c3aed;--text:#fff;--muted:#a1a1aa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:18px;cursor:pointer}
.logo{font-weight:700;color:var(--p);font-size:16px}
.box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;min-height:100px;background:transparent;border:none;outline:none;color:#fff;font-size:15px;line-height:1.5;resize:none;font-family:inherit}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:25px;border:none;font-weight:600;font-size:13px;cursor:pointer}
.btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn-g{background:rgba(255,255,255,.1);color:#fff}
.btn:disabled{opacity:.45}
.screen{display:none}
.screen.on{display:block}
.story{font-size:15px;line-height:1.65;color:#e4e4e7;white-space:pre-wrap}
.scene{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.scene h3{font-size:13px;color:var(--p);margin-bottom:6px}
.scene p{font-size:14px;line-height:1.5;color:#ddd}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.ov.on{display:flex}
.bar{width:200px;height:6px;background:#333;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .3s}
.msg{font-size:13px;color:#ccc}
.editbox{display:none;margin-top:12px}
.editbox.on{display:block}
.editbox textarea{min-height:70px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;padding:10px}
.err{color:#f87171;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <button class="back" onclick="goHome()">←</button>
  <div class="logo">Velorix AI</div>
  <div style="width:40px"></div>
</div>

<!-- STEP 1: prompt -->
<div id="s1" class="screen on">
  <div class="box">
    <label>अपनी कहानी / विषय</label>
    <textarea id="prompt" placeholder="जैसे: गरीब किसान की स्टोरी"></textarea>
    <div class="row">
      <button class="btn btn-p" id="btnGen" onclick="genStory()">Create Story</button>
    </div>
    <div class="err" id="err1"></div>
  </div>
</div>

<!-- STEP 2: story -->
<div id="s2" class="screen">
  <div class="box">
    <label>Generated Story</label>
    <div class="story" id="storyText"></div>
    <div class="editbox" id="editBox">
      <label style="margin-top:8px">क्या बदलना है? (छोटा सुझाव)</label>
      <textarea id="editSug" placeholder="जैसे: किसान का नाम राम रखो, अंत खुश रखो"></textarea>
      <div class="row">
        <button class="btn btn-g" onclick="closeEdit()">Cancel</button>
        <button class="btn btn-p" onclick="applyEdit()">Apply Edit</button>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-g" onclick="openEdit()">Edit</button>
      <button class="btn btn-p" onclick="genScenes()">Continue</button>
    </div>
    <div class="err" id="err2"></div>
  </div>
</div>

<!-- STEP 3: scenes -->
<div id="s3" class="screen">
  <div class="box">
    <label>Scenes (\~1 min video)</label>
    <div id="sceneList"></div>
    <div class="row">
      <button class="btn btn-g" onclick="show('s2')">← Story</button>
      <button class="btn btn-p" onclick="nextPhoto()">Continue → Photos</button>
    </div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="msg" id="ovMsg">Generating...</div>
  <div class="bar"><i id="ovBar"></i></div>
</div>

<script>
var storyFull="";
var scenes=[];

function goHome(){ window.location.href="home.html"; }
function show(id){
  ["s1","s2","s3"].forEach(function(x){ document.getElementById(x).classList.remove("on"); });
  document.getElementById(id).classList.add("on");
}
function prog(on,msg,pct){
  var o=document.getElementById("ov");
  if(on){ o.classList.add("on"); document.getElementById("ovMsg").textContent=msg||"..."; document.getElementById("ovBar").style.width=(pct||10)+"%"; }
  else o.classList.remove("on");
}
function keys(){
  return {
    groq:(localStorage.getItem("VX_GROQ")||"").trim(),
    gemini:(localStorage.getItem("VX_GEMINI")||"").trim(),
    or:(localStorage.getItem("VX_OR")||"").trim()
  };
}

async function callAI(system,user){
  var k=keys();
  var lastErr="No API key";
  // 1 Groq
  if(k.groq){
    try{
      var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+k.groq},
        body:JSON.stringify({
          model:"llama-3.1-8b-instant",
          messages:[{role:"system",content:system},{role:"user",content:user}],
          temperature:0.7,
          max_tokens:1200
        })
      });
      var j=await r.json();
      if(!r.ok) throw new Error((j.error&&j.error.message)||("Groq "+r.status));
      var t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(t&&t.trim()) return t.trim();
      throw new Error("Groq empty");
    }catch(e){ lastErr=e.message||String(e); }
  }
  // 2 OpenRouter
  if(k.or){
    try{
      var r2=await fetch("https://openrouter.ai/api/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+k.or},
        body:JSON.stringify({
          model:"openrouter/free",
          messages:[{role:"system",content:system},{role:"user",content:user}]
        })
      });
      var j2=await r2.json();
      if(!r2.ok) throw new Error((j2.error&&j2.error.message)||("OR "+r2.status));
      var t2=j2.choices&&j2.choices[0]&&j2.choices[0].message&&j2.choices[0].message.content;
      if(t2&&t2.trim()) return t2.trim();
      throw new Error("OR empty");
    }catch(e){ lastErr=e.message||String(e); }
  }
  // 3 Gemini
  if(k.gemini){
    try{
      var url="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(k.gemini);
      var r3=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[{text:system+"\n\n"+user}]}]
        })
      });
      var j3=await r3.json();
      if(!r3.ok) throw new Error((j3.error&&j3.error.message)||("Gemini "+r3.status));
      var t3=j3.candidates&&j3.candidates[0]&&j3.candidates[0].content&&j3.candidates[0].content.parts&&j3.candidates[0].content.parts[0].text;
      if(t3&&t3.trim()) return t3.trim();
      throw new Error("Gemini empty");
    }catch(e){ lastErr=e.message||String(e); }
  }
  throw new Error(lastErr);
}

async function genStory(){
  var p=document.getElementById("prompt").value.trim();
  var err=document.getElementById("err1");
  err.textContent="";
  if(!p){ err.textContent="पहले विषय लिखो"; return; }
  var k=keys();
  if(!k.groq&&!k.gemini&&!k.or){ err.textContent="Owner → Profile → API Keys में key सेव करो"; return; }
  prog(true,"Story बन रही है...",25);
  try{
    var sys="Tu Velorix AI story writer hai. User ke topic par Hindi mein ek short video script-style kahani likh. Maximum \~1 minute bolne layak (lagbhag 120-160 words). Simple, clear scenes. Sirf kahani likh, extra heading mat likh.";
    var out=await callAI(sys,p);
    storyFull=out;
    document.getElementById("storyText").textContent=storyFull;
    prog(true,"Done",100);
    setTimeout(function(){ prog(false); show("s2"); },300);
  }catch(e){
    prog(false);
    err.textContent="Story नहीं बनी: "+(e.message||e);
  }
}

function openEdit(){ document.getElementById("editBox").classList.add("on"); }
function closeEdit(){ document.getElementById("editBox").classList.remove("on"); }

async function applyEdit(){
  var sug=document.getElementById("editSug").value.trim();
  var err=document.getElementById("err2");
  err.textContent="";
  if(!sug){ err.textContent="सुझाव लिखो"; return; }
  prog(true,"Edit लग रहा है...",40);
  try{
    var sys="Tu story editor hai. Neeche di hui kahani ko user ke suggestion ke hisaab se thoda change kar. Poori kahani wapas likh. \~1 minute (120-160 words). Hindi. Sirf updated kahani.";
    var out=await callAI(sys,"STORY:\n"+storyFull+"\n\nSUGGESTION:\n"+sug);
    storyFull=out;
    document.getElementById("storyText").textContent=storyFull;
    document.getElementById("editSug").value="";
    closeEdit();
    prog(false);
  }catch(e){
    prog(false);
    err.textContent="Edit fail: "+(e.message||e);
  }
}

async function genScenes(){
  var err=document.getElementById("err2");
  err.textContent="";
  prog(true,"Scenes टूट रहे हैं...",50);
  try{
    var sys="Is kahani ko 4 se 6 short scenes mein todo. Har line format EXACT: SCENE|number|text. Example: SCENE|1|Kisaan subah khet mein pahunchta hai. Sirf ye format, aur kuch mat likh. Hindi.";
    var out=await callAI(sys,storyFull);
    scenes=[];
    out.split("\n").forEach(function(line){
      line=line.trim();
      var m=line.match(/^SCENE\|(\d+)\|(.+)$/i);
      if(m) scenes.push({n:m[1],t:m[2].trim()});
    });
    if(!scenes.length){
      // fallback split
      var parts=storyFull.split(/(?<=[।.!?])\s+/).filter(Boolean);
      var chunk=Math.max(1,Math.ceil(parts.length/5));
      for(var i=0;i<parts.length;i+=chunk){
        scenes.push({n:String(scenes.length+1),t:parts.slice(i,i+chunk).join(" ")});
      }
    }
    var box=document.getElementById("sceneList");
    box.innerHTML="";
    scenes.forEach(function(s){
      var d=document.createElement("div");
      d.className="scene";
      d.innerHTML="<h3>सीन "+s.n+"</h3><p></p>";
      d.querySelector("p").textContent=s.t;
      box.appendChild(d);
    });
    try{ localStorage.setItem("VX_STORY",storyFull); localStorage.setItem("VX_SCENES",JSON.stringify(scenes)); }catch(e){}
    prog(false);
    show("s3");
  }catch(e){
    prog(false);
    err.textContent="Scenes fail: "+(e.message||e);
  }
}

function nextPhoto(){
  alert("अगला स्टेप: Photos / Characters — जल्द");
}

// home se prompt
(function(){
  var q=new URLSearchParams(location.search).get("q");
  if(q) document.getElementById("prompt").value=q;
  var h=localStorage.getItem("VX_PROMPT");
  if(!q&&h) document.getElementById("prompt").value=h;
})();
</script>
</body>
</html>
