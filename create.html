<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create · Velorix AI</title>
<style>
:root{
  --bg:#0a0712;--bg2:#120c1c;--card:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08);--p:#a855f7;--p2:#7c3aed;--p3:#c084fc;
  --text:#faf5ff;--muted:#9b92ad;--ok:#34d399;--danger:#f87171;
  --r:18px;--shadow:0 12px 40px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(120% 80% at 50% -10%,#2a1548 0%,var(--bg) 55%)}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(16px);background:rgba(10,7,18,.75);z-index:30}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.top h1{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#fff,var(--p3));-webkit-background-clip:text;color:transparent}
.pill{font-size:11px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 120px}
.hero{margin-bottom:14px}
.hero p{font-size:13px;color:var(--muted);line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.input{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);padding:14px;font-size:15px;line-height:1.55;resize:vertical}
.input:focus{outline:none;border-color:rgba(168,85,247,.55);box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.story-view{display:none;white-space:pre-wrap;font-size:15px;line-height:1.6;color:#f3e8ff}
.story-view.on{display:block}
.err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px 16px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-main{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 28px rgba(124,58,237,.35)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,7,18,.96) 30%);display:flex;gap:10px;z-index:40}
/* progress */
.prog{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,4,12,.82);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;gap:16px}
.prog.on{display:flex}
.prog-ring{width:56px;height:56px;border-radius:50%;border:3px solid rgba(168,85,247,.2);border-top-color:var(--p);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-bar{width:70%;max-width:280px;height:6px;border-radius:99px;background:#1f1830;overflow:hidden}
.prog-bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--p),var(--p3));transition:width .35s ease}
.prog-text{font-size:13px;color:#ddd}
/* edit sheet */
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:110;background:#140f1c;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);box-shadow:var(--shadow)}
.sheet.on{display:block}
.sheet h3{font-size:15px;margin-bottom:8px}
.sheet textarea{width:100%;min-height:88px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;padding:12px;font-size:14px;resize:none}
.sheet .actions{margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" type="button" id="btnBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Velorix AI</h1>
    <span class="pill" id="langPill">HI</span>
  </div>

  <div class="main">
    <div class="hero">
      <p id="heroText">विषय लिखो · AI पूरी short-video स्टोरी बनाएगा</p>
    </div>

    <div class="card" id="inputCard">
      <div class="label">Story · विषय</div>
      <textarea class="input" id="topicInput" placeholder="जैसे: गरीब किसान की शाम की कहानी…"></textarea>
      <p class="err" id="errBox"></p>
      <p class="hint">भाषा index से आती है · Size / Quality बाद में (Characters से पहले)</p>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="label">Generated Story</div>
      <div class="story-view on" id="storyView"></div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" id="btnEdit">Edit</button>
        <button class="btn btn-main" type="button" id="btnToScenes">Continue → Scenes</button>
      </div>
    </div>
  </div>

  <div class="bottom" id="bottomBar">
    <button class="btn btn-ghost" type="button" id="btnDraft">Draft</button>
    <button class="btn btn-main" type="button" id="btnCreate">Create Story</button>
  </div>
</div>

<div class="prog" id="prog">
  <div class="prog-ring"></div>
  <div class="prog-bar"><i id="progBar"></i></div>
  <p class="prog-text" id="progText">Story बन रही है…</p>
</div>

<div class="sheet" id="editSheet">
  <h3>Story Edit</h3>
  <p class="hint">छोटा सुझाव लिखो — AI उसी हिसाब से स्टोरी बदलेगा</p>
  <textarea id="editInput" placeholder="जैसे: अंत खुशहाल करो, किसान का नाम राम रखो…"></textarea>
  <div class="actions">
    <button class="btn btn-ghost" type="button" id="btnEditCancel">Cancel</button>
    <button class="btn btn-main" type="button" id="btnEditApply">Apply Edit</button>
  </div>
</div>

<script>
/* === CREATE PART 1 · Story first · premium shell · PART 2 neeche === */
var VX = {
  lang: (localStorage.getItem("velorix_lang") || localStorage.getItem("VX_LANG") || "hi").toLowerCase(),
  story: "",
  step: "topic"
};
document.getElementById("langPill").textContent = VX.lang.toUpperCase();

try {
  var q = new URLSearchParams(location.search).get("q");
  var p = q || localStorage.getItem("VX_PROMPT") || "";
  if (p) document.getElementById("topicInput").value = p;
  var st = localStorage.getItem("VX_STORY") || "";
  if (st && st.length > 40) {
    VX.story = st;
    vxShowResult(st);
  }
} catch (e) {}

function vxShowResult(text) {
  VX.story = text;
  VX.step = "story";
  document.getElementById("storyView").textContent = text;
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("inputCard").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";
  document.getElementById("heroText").textContent = "Edit करो या Scenes पर जाओ";
}

function vxSetProg(on, pct, msg) {
  var el = document.getElementById("prog");
  if (on) {
    el.classList.add("on");
    document.getElementById("progBar").style.width = (pct || 12) + "%";
    document.getElementById("progText").textContent = msg || "…";
  } else el.classList.remove("on");
}

document.getElementById("btnBack").onclick = function () {
  if (VX.step === "story") {
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("inputCard").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    document.getElementById("heroText").textContent = "विषय लिखो · AI पूरी short-video स्टोरी बनाएगा";
    VX.step = "topic";
    return;
  }
  location.href = "home.html";
};

document.getElementById("btnDraft").onclick = function () {
  try {
    localStorage.setItem("VX_PROMPT", document.getElementById("topicInput").value || "");
  } catch (e) {}
  alert("Draft save हो गया");
};

document.getElementById("btnEdit").onclick = function () {
  document.getElementById("editInput").value = "";
  document.getElementById("editSheet").classList.add("on");
};
document.getElementById("btnEditCancel").onclick = function () {
  document.getElementById("editSheet").classList.remove("on");
};

/* Create / Edit AI — PART 2 में real API; यहाँ safe placeholder hook */
document.getElementById("btnCreate").onclick = function () {
  if (typeof vxRunStoryAI === "function") {
    vxRunStoryAI();
    return;
  }
  var t = (document.getElementById("topicInput").value || "").trim();
  document.getElementById("errBox").textContent = "";
  if (!t) {
    document.getElementById("errBox").textContent = "पहले विषय लिखो";
    return;
  }
  alert("PART 2 लगाओ · Story AI + बैंगनी progress");
};

document.getElementById("btnEditApply").onclick = function () {
  if (typeof vxRunStoryEdit === "function") {
    vxRunStoryEdit();
    return;
  }
  try {
    localStorage.setItem("VX_STORY", VX.story || "");
    localStorage.setItem("VX_CREATE_STEP", "scenes");
  } catch (e) {}
  alert("PART 2 · Scenes + Size स्क्रीन");
};
/* === CREATE PART 2 FINAL · models + premium small loader + full story === */
(function () {
  var s = document.createElement("style");
  s.textContent = [
    "#resultCard{display:none!important;flex-direction:column;flex:1;min-height:0;padding:0!important;border:none!important;background:transparent!important;box-shadow:none!important}",
    "#resultCard.on{display:flex!important}",
    ".story-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 12px;min-height:48vh}",
    ".story-body{font-size:16px;line-height:1.75;color:#f5f0ff;white-space:pre-wrap}",
    ".scenes-wrap{margin-top:16px}",
    ".scene-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px;margin-bottom:10px}",
    ".scene-card .sn{font-size:11px;font-weight:700;color:#c084fc;letter-spacing:.06em}",
    ".scene-card .st{margin:6px 0 8px;font-size:14px;line-height:1.5;color:#efe8ff}",
    ".scene-card .pr{font-size:11px;color:#a78bfa;line-height:1.4;margin-top:6px}",
    ".result-bottom{flex-shrink:0;display:flex;gap:10px;padding:12px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,7,18,.97) 28%)}",
    ".prog{background:rgba(6,4,12,.9)!important;backdrop-filter:blur(12px)}",
    ".prog-ring{display:none!important}",
    ".prog-wrap{width:56%;max-width:220px;text-align:center}",
    ".prog-pct{font-size:22px;font-weight:800;color:#faf5ff;margin-bottom:10px}",
    ".prog-bar{height:6px!important;border-radius:99px;background:#160e28!important;border:1px solid rgba(168,85,247,.35)!important;overflow:hidden}",
    ".prog-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c084fc)!important;transition:width .2s ease}",
    ".prog-text{margin-top:10px;font-size:12px;font-weight:600;color:#c4b5fd}",
    "#editStoryPreview{max-height:26vh;overflow:auto;font-size:13px;line-height:1.5;color:#e9e4f5;margin:0 0 10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.4);white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)}"
  ].join("");
  document.head.appendChild(s);
  var prog = document.getElementById("prog");
  if (prog) {
    prog.innerHTML = '<div class="prog-wrap"><div class="prog-pct" id="progPct">0%</div><div class="prog-bar"><i id="progBar"></i></div><p class="prog-text" id="progText">…</p></div>';
  }
  var rc = document.getElementById("resultCard");
  if (rc) {
    rc.innerHTML =
      '<div class="story-scroll" id="storyScroll">' +
      '<div class="label">GENERATED STORY</div>' +
      '<div class="story-body" id="storyView"></div>' +
      '<div class="scenes-wrap" id="scenesBlock" style="display:none"></div></div>' +
      '<div class="result-bottom">' +
      '<button class="btn btn-ghost" type="button" id="btnEdit">Edit</button>' +
      '<button class="btn btn-main" type="button" id="btnToScenes">Continue → Scenes</button></div>';
  }
})();

VX.scenes = VX.scenes || [];
VX.scenePack = VX.scenePack || [];
VX.MAX_STORY_CHARS = 900;
VX.MIN_STORY_CHARS = 80;
VX._progTimer = null;
VX._progVal = 0;

function vxKeys() {
  return {
    groq: (localStorage.getItem("VX_GROQ") || "").trim(),
    gemini: (localStorage.getItem("VX_GEMINI") || "").trim(),
    or: (localStorage.getItem("VX_OR") || "").trim()
  };
}
function vxLangName() {
  var m = { hi: "हिन्दी", en: "English", ta: "Tamil", te: "Telugu", pa: "Punjabi", gu: "Gujarati", bn: "Bengali", mr: "Marathi", kn: "Kannada", ml: "Malayalam", or: "Odia", ur: "Urdu", es: "Spanish", fr: "French", de: "German", ar: "Arabic", pt: "Portuguese", zh: "Chinese", ja: "Japanese", ru: "Russian" };
  return m[VX.lang] || VX.lang;
}
function vxLooksLikeFullStory(t) {
  t = (t || "").trim();
  return t.length >= 160 || (((t.match(/[.।!?\n]/g) || []).length >= 3) && t.length >= 120);
}
function vxIsBadStory(t) {
  t = (t || "").trim();
  if (t.length < VX.MIN_STORY_CHARS) return true;
  if (/user\s*safety/i.test(t) || /^safe\.?$/i.test(t)) return true;
  return false;
}
function vxTrimToMinute(t) {
  t = (t || "").trim();
  if (t.length <= VX.MAX_STORY_CHARS) return t;
  var cut = t.slice(0, VX.MAX_STORY_CHARS);
  var i = Math.max(cut.lastIndexOf("।"), cut.lastIndexOf("."), cut.lastIndexOf("\n"));
  if (i > 200) cut = cut.slice(0, i + 1);
  return cut.trim();
}

function vxSetProg(on, pct, msg) {
  var el = document.getElementById("prog");
  if (!el) return;
  if (VX._progTimer) { clearInterval(VX._progTimer); VX._progTimer = null; }
  if (!on) { el.classList.remove("on"); VX._progVal = 0; return; }
  el.classList.add("on");
  VX._progVal = Math.max(1, Math.min(99, pct || 1));
  var bar = document.getElementById("progBar");
  var p = document.getElementById("progPct");
  var t = document.getElementById("progText");
  if (bar) bar.style.width = VX._progVal + "%";
  if (p) p.textContent = VX._progVal + "%";
  if (t) t.textContent = msg || "…";
  VX._progTimer = setInterval(function () {
    if (VX._progVal >= 90) return;
    VX._progVal += 1;
    if (bar) bar.style.width = VX._progVal + "%";
    if (p) p.textContent = VX._progVal + "%";
  }, 320);
}

async function vxFetchJson(url, opt, ms) {
  ms = ms || 40000;
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
  try {
    var o = opt || {};
    if (ctrl) o.signal = ctrl.signal;
    var r = await fetch(url, o);
    var j = await r.json().catch(function () { return {}; });
    return { r: r, j: j };
  } finally { clearTimeout(timer); }
}

async function vxCallGroq(system, user) {
  var k = vxKeys().groq;
  if (!k) throw new Error("Groq key नहीं");
  var models = ["llama-3.1-8b-instant", "llama-3.3-70b-versatile", "openai/gpt-oss-20b"];
  var last = "Groq fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var res = await vxFetchJson("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
        body: JSON.stringify({
          model: models[i], temperature: 0.7, max_tokens: 1200,
          messages: [{ role: "system", content: system }, { role: "user", content: user }]
        })
      }, 35000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("Groq " + res.r.status); continue; }
      var t = res.j.choices && res.j.choices[0] && res.j.choices[0].message && res.j.choices[0].message.content;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "Groq bad/short";
    } catch (e) { last = /abort/i.test(String(e)) ? "Groq timeout" : String(e.message || e); }
  }
  throw new Error(last);
}

async function vxCallOR(system, user) {
  var k = vxKeys().or;
  if (!k) throw new Error("OpenRouter key नहीं");
  var models = ["openrouter/free", "meta-llama/llama-3.3-70b-instruct:free", "google/gemma-2-9b-it:free"];
  var last = "OR fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var res = await vxFetchJson("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
        body: JSON.stringify({
          model: models[i], temperature: 0.7, max_tokens: 1200,
          messages: [{ role: "system", content: system }, { role: "user", content: user }]
        })
      }, 40000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("OR " + res.r.status); continue; }
      var t = res.j.choices && res.j.choices[0] && res.j.choices[0].message && res.j.choices[0].message.content;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "OR empty/safety";
    } catch (e) { last = String(e.message || e); }
  }
  throw new Error(last);
}

async function vxCallGemini(system, user) {
  var k = vxKeys().gemini;
  if (!k) throw new Error("Gemini key नहीं");
  var models = ["gemini-2.5-flash", "gemini-3.8-flash", "gemini-flash-latest"];
  var last = "Gemini fail";
  for (var i = 0; i < models.length; i++) {
    try {
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + models[i] + ":generateContent?key=" + encodeURIComponent(k);
      var res = await vxFetchJson(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: system + "\n\n" + user }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 1200 }
        })
      }, 40000);
      if (!res.r.ok) { last = (res.j.error && res.j.error.message) || ("Gemini " + res.r.status); continue; }
      var t = res.j.candidates && res.j.candidates[0] && res.j.candidates[0].content &&
        res.j.candidates[0].content.parts && res.j.candidates[0].content.parts[0] &&
        res.j.candidates[0].content.parts[0].text;
      if (t && !vxIsBadStory(t)) return t.trim();
      last = "Gemini empty";
    } catch (e) { last = String(e.message || e); }
  }
  throw new Error(last);
}

async function vxCallAI(system, user) {
  var errs = [];
  try { return await vxCallGroq(system, user); } catch (e) { errs.push("Groq: " + e.message); }
  try { return await vxCallOR(system, user); } catch (e) { errs.push("OR: " + e.message); }
  try { return await vxCallGemini(system, user); } catch (e) { errs.push("Gemini: " + e.message); }
  throw new Error(errs.join(" | "));
}

function vxShowResult(text) {
  VX.story = text;
  VX.step = "story";
  var sv = document.getElementById("storyView");
  if (sv) sv.textContent = text;
  var rc = document.getElementById("resultCard");
  if (rc) { rc.style.display = "flex"; rc.classList.add("on"); }
  var ic = document.getElementById("inputCard");
  if (ic) ic.style.display = "none";
  var bb = document.getElementById("bottomBar");
  if (bb) bb.style.display = "none";
  var ht = document.getElementById("heroText");
  if (ht) ht.textContent = "पूरी story · Edit या Scenes";
  var btn = document.getElementById("btnToScenes");
  if (btn) {
    btn.textContent = "Continue → Scenes";
    btn.onclick = function () { vxGoScenes(); };
  }
}

async function vxRunStoryAI() {
  var topic = (document.getElementById("topicInput").value || "").trim();
  var err = document.getElementById("errBox");
  if (err) err.textContent = "";
  if (!topic) { if (err) err.textContent = "विषय लिखो"; return; }
  if (topic.length > VX.MAX_STORY_CHARS + 250) {
    if (err) err.textContent = "बहुत लंबी · \~1 मिनट";
    return;
  }
  /* पहले से पूरी story = AI स्किप, सीधा आगे */
  if (vxLooksLikeFullStory(topic)) {
    var keep = vxTrimToMinute(topic);
    try {
      localStorage.setItem("VX_PROMPT", topic.slice(0, 120));
      localStorage.setItem("VX_STORY", keep);
    } catch (e) {}
    vxShowResult(keep);
    return;
  }
  var k = vxKeys();
  if (!k.groq && !k.gemini && !k.or) {
    if (err) err.textContent = "API key · api.html";
    return;
  }
  var btn = document.getElementById("btnCreate");
  if (btn) btn.disabled = true;
  vxSetProg(true, 4, "Story…");
  try {
    var story = await vxCallAI(
      "Write ONE short-video story in " + vxLangName() + ". About 1 minute spoken. No markdown. No safety labels. Story text only.",
      "Topic: " + topic
    );
    story = vxTrimToMinute(story);
    if (vxIsBadStory(story)) throw new Error("Story valid नहीं");
    try {
      localStorage.setItem("VX_PROMPT", topic);
      localStorage.setItem("VX_STORY", story);
    } catch (e) {}
    if (document.getElementById("progPct")) document.getElementById("progPct").textContent = "100%";
    if (document.getElementById("progBar")) document.getElementById("progBar").style.width = "100%";
    vxShowResult(story);
  } catch (e) {
    if (err) err.textContent = String(e.message || e);
  } finally {
    vxSetProg(false);
    if (btn) btn.disabled = false;
  }
}

async function vxRunStoryEdit() {
  var note = (document.getElementById("editInput").value || "").trim();
  if (!note) { alert("सुझाव लिखो"); return; }
  if (!VX.story) { alert("पहले story"); return; }
  document.getElementById("editSheet").classList.remove("on");
  vxSetProg(true, 5, "Edit…");
  try {
    var story = await vxCallAI(
      "Edit story. Language " + vxLangName() + ". \~1 min. Full story only.",
      "Story:\n" + VX.story + "\n\nEdit:\n" + note
    );
    story = vxTrimToMinute(story);
    if (vxIsBadStory(story)) throw new Error("Edit fail");
    try { localStorage.setItem("VX_STORY", story); } catch (e) {}
    var sb = document.getElementById("scenesBlock");
    if (sb) { sb.style.display = "none"; sb.innerHTML = ""; }
    vxShowResult(story);
  } catch (e) { alert(String(e.message || e)); }
  finally { vxSetProg(false); }
}

function vxParseScenePack(raw) {
  var pack = [];
  try {
    var m = String(raw).match(/\[[\s\S]*\]/);
    if (m) {
      var arr = JSON.parse(m[0]);
      if (Array.isArray(arr)) {
        arr.forEach(function (o, i) {
          pack.push({
            n: i + 1,
            text: String(o.text || o.scene || o.dialogue || "").trim(),
            photo: String(o.photo_prompt || o.photo || "").trim(),
            video: String(o.video_prompt || o.video || "").trim()
          });
        });
      }
    }
  } catch (e) {}
  if (!pack.length) {
    String(raw).split(/\n+/).forEach(function (ln) {
      ln = ln.trim();
      if (!ln) return;
      if (/^(scene|सीन)\s*\d+/i.test(ln) || /^\d+[\.\)]/.test(ln)) {
        pack.push({
          n: pack.length + 1,
          text: ln.replace(/^(scene|सीन)\s*\d+[:\.\-\s]*/i, "").replace(/^\d+[\.\)]\s*/, ""),
          photo: "", video: ""
        });
      }
    });
  }
  return pack.slice(0, 6);
}

function vxRenderScenes(pack) {
  var box = document.getElementById("scenesBlock");
  if (!box) return;
  box.style.display = "block";
  box.innerHTML = '<div class="label">SCENES · PHOTO · VIDEO</div>';
  pack.forEach(function (sc) {
    var d = document.createElement("div");
    d.className = "scene-card";
    d.innerHTML =
      '<div class="sn">सीन ' + sc.n + '</div><div class="st"></div>' +
      '<div class="pr"><b>Photo:</b> <span class="ph"></span></div>' +
      '<div class="pr"><b>Video:</b> <span class="vid"></span></div>';
    d.querySelector(".st").textContent = sc.text || "—";
    d.querySelector(".ph").textContent = sc.photo || "—";
    d.querySelector(".vid").textContent = sc.video || "—";
    box.appendChild(d);
  });
  var btn = document.getElementById("btnToScenes");
  if (btn) {
    btn.textContent = "Continue → Size";
    btn.onclick = function () {
      if (typeof vxShowSizeScreen === "function") vxShowSizeScreen();
      else alert("PART 3 · Size · Characters · Photos");
    };
  }
  try {
    var sc = document.getElementById("storyScroll");
    if (sc) sc.scrollTop = sc.scrollHeight;
  } catch (e) {}
}

async function vxGoScenes() {
  if (!VX.story) { alert("पहले story"); return; }
  vxSetProg(true, 6, "Scenes…");
  try {
    var raw = await vxCallAI(
      "Split into 4-6 scenes. Language " + vxLangName() +
      '. JSON only: [{"text":"...","photo_prompt":"...","video_prompt":"..."}]. Same character lock in prompts.',
      VX.story
    );
    var pack = vxParseScenePack(raw);
    if (!pack.length) pack = [{ n: 1, text: VX.story.slice(0, 200), photo: "", video: "" }];
    VX.scenePack = pack;
    VX.scenes = pack.map(function (p) { return p.text; });
    try {
      localStorage.setItem("VX_SCENES", JSON.stringify(VX.scenes));
      localStorage.setItem("VX_SCENE_PACK", JSON.stringify(pack));
      localStorage.setItem("VX_CREATE_STEP", "scenes_done");
    } catch (e) {}
    vxRenderScenes(pack);
  } catch (e) { alert(String(e.message || e)); }
  finally { vxSetProg(false); }
}

document.getElementById("btnEdit").onclick = function () {
  var sheet = document.getElementById("editSheet");
  var ta = document.getElementById("editInput");
  var prev = document.getElementById("editStoryPreview");
  if (!prev) {
    prev = document.createElement("div");
    prev.id = "editStoryPreview";
    sheet.insertBefore(prev, ta);
  }
  prev.textContent = VX.story || "";
  ta.value = "";
  ta.placeholder = "क्या बदलना है?";
  sheet.classList.add("on");
};
document.getElementById("btnEditApply").onclick = function () { vxRunStoryEdit(); };
document.getElementById("btnToScenes").onclick = function () { vxGoScenes(); };

document.getElementById("btnBack").onclick = function (e) {
  if (e) e.preventDefault();
  var sheet = document.getElementById("editSheet");
  if (sheet && sheet.classList.contains("on")) { sheet.classList.remove("on"); return; }
  if (VX.step === "story") {
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("resultCard").classList.remove("on");
    document.getElementById("inputCard").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    document.getElementById("heroText").textContent = "विषय लिखो · AI पूरी short-video स्टोरी बनाएगा";
    VX.step = "topic";
    return;
  }
  location.href = "home.html";
};
