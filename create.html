<style>

  --bg:#0a0712;--bg2:#120c1c;--card:rgba(255,255,255,.04);

  --text:#faf5ff;--muted:#9b92ad;--ok:#34d399;--danger:#f87171;
  --r:18px;--shadow:0 12px 40px rgba(0,0,0,.45);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(120% 80% at 50% -10%,#2a1548 0%,var(--bg) 55%)}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(16px);background:rgba(10,7,18,.75);z-index:30}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.top h1{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#fff,var(--p3));-webkit-background-clip:text;color:transparent}
.pill{font-size:11px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 120px}
.hero{margin-bottom:14px}
.hero p{font-size:13px;color:var(--muted);line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.input{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);padding:14px;font-size:15px;line-height:1.55;resize:vertical}
.input:focus{outline:none;border-color:rgba(168,85,247,.55);box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.story-view{display:none;white-space:pre-wrap;font-size:15px;line-height:1.6;color:#f3e8ff}
.story-view.on{display:block}
.err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px 16px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-main{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 28px rgba(124,58,237,.35)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,7,18,.96) 30%);display:flex;gap:10px;z-index:40}
/* progress */
.prog{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,4,12,.82);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;gap:16px}
.prog.on{display:flex}
.prog-ring{width:56px;height:56px;border-radius:50%;border:3px solid rgba(168,85,247,.2);border-top-color:var(--p);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-bar{width:70%;max-width:280px;height:6px;border-radius:99px;background:#1f1830;overflow:hidden}
.prog-bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--p),var(--p3));transition:width .35s ease}
.prog-text{font-size:13px;color:#ddd}
/* edit sheet */
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:110;background:#140f1c;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);box-shadow:var(--shadow)}
.sheet.on{display:block}
.sheet h3{font-size:15px;margin-bottom:8px}
.sheet textarea{width:100%;min-height:88px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;padding:12px;font-size:14px;resize:none}
.sheet .actions{margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>

function vxKeys() {
  var raw = [];
  try {
    JSON.parse(localStorage.getItem("VX_STORY_KEYS") || "[]").forEach(function (it) {
      if (it && it.key && (it.provider === "gemini" || /gemini|google/i.test(it.name || "") || /^AIza/.test(it.key))) raw.push(it.key);
    });
  } catch (e0) {}
  ["VX_GEMINI", "VX_GEMINI2", "VX_GEMINI3", "VX_GEMINI_1", "VX_GEMINI_2", "VX_GEMINI_3"].forEach(function (n) {
    raw.push(localStorage.getItem(n) || "");
  });
  var seen = {}, list = [];
  raw.join(" ").split(/[\s,;|]+/).forEach(function (x) {
    x = x.trim();
    if (x.length >= 20 && !seen[x]) { seen[x] = 1; list.push(x); }
  });
  return { gemini: list[0] || "", geminis: list, groq: "", or: "" };
}
function vxLangName() {
  var m = { hi: "हिन्दी", en: "English", ta: "Tamil", te: "Telugu", pa: "Punjabi", gu: "Gujarati", bn: "Bengali", mr: "Marathi", kn: "Kannada", ml: "Malayalam", or: "Odia", ur: "Urdu", es: "Spanish", fr: "French", de: "German", ar: "Arabic", pt: "Portuguese", zh: "Chinese", ja: "Japanese", ru: "Russian" };
  return m[VX.lang] || VX.lang;
}
function vxLooksLikeFullStory(t) {
  t = (t || "").trim();
  return t.length >= 160 || (((t.match(/[.।!?\n]/g) || []).length >= 3) && t.length >= 120);
}
function vxIsBadStory(t) {
  t = (t || "").trim();
  if (t.length < VX.MIN_STORY_CHARS) return true;
  if (/user\s*safety/i.test(t) || /^safe\.?$/i.test(t)) return true;
  return false;
}
function vxWordCount(t) { return String(t || "").trim().split(/\s+/).filter(Boolean).length; }
function vxStorySecs(t) { return Math.round(vxWordCount(t) / VX.WORDS_PER_SEC); }
function vxTrimToMinute(t) {
  t = (t || "").trim();
  if (vxWordCount(t) <= VX.MAX_STORY_WORDS) return t;
  var sents = t.split(/(?<=[।.!?])\s+/), out = [], n = 0;
  for (var i = 0; i < sents.length; i++) {
    var cnt = vxWordCount(sents[i]);
    if (n + cnt > VX.MAX_STORY_WORDS) break;
    out.push(sents[i]); n += cnt;
  }
  if (!out.length) out = [t.split(/\s+/).slice(0, VX.MAX_STORY_WORDS).join(" ")];
  return out.join(" ").trim();
}

function vxTrimToMinute(t) {
  t = (t || "").trim();
  if (vxWordCount(t) <= VX.MAX_STORY_WORDS) return t;
  var sents = t.split(/(?<=[।.!?])\s+/), out = [], n = 0;

async function vxFetchJson(url, opt, ms) {

  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;

  } finally { clearTimeout(timer); }
}

function vxGeminiIsQuota(status, msg) {

function vxGeminiIsKeyBad(status, msg) {

/* अभी इस key को जो models सच में मिलते हैं (Google से पूछकर) · 6 घंटे याद रखता है.
   क्रम: नया flash, नया lite (कम भीड़), पुराने, फिर Gemma (खुले models, कम भीड़), फिर alias */
function vxGeminiRank(names) {
  function ver(n) { var m = /(?:gemini|gemma)-(\d+(?:\.\d+)?)/.exec(n); return m ? parseFloat(m[1]) : 0; }
  function isLite(n) { return /lite/.test(n); }
  function size(n) { var m = /(\d+)b/.exec(n); return m ? parseInt(m[1], 10) : 0; }
  var g = names.filter(function (n) { return /^gemini-/.test(n); });
  var gm = names.filter(function (n) { return /^gemma-/.test(n); });
  g.sort(function (x, y) { var d = ver(y) - ver(x); return d || ((isLite(x) ? 1 : 0) - (isLite(y) ? 1 : 0)); });
  gm.sort(function (x, y) { return (ver(y) - ver(x)) || (size(y) - size(x)); });
  var out = [];
  function add(n) { if (n && out.indexOf(n) < 0) out.push(n); }
  add(g.filter(function (n) { return !isLite(n); })[0]);
  add(g.filter(isLite)[0]);
  g.forEach(function (n) { if (out.length < 5) add(n); });
  if (gm[0]) add(gm[0]);
  add("gemini-flash-lite-latest");
  add("gemini-flash-latest");
  return out.slice(0, 7);
}
async function vxGeminiModels(k) {
  try {
    var c = JSON.parse(localStorage.getItem("VX_GEM_MODELS2") || "null");
    if (c && c.list && c.list.length && Date.now() - c.t < 6 * 3600 * 1000) return c.list;
  } catch (e0) {}
  var names = [];
  try {
    var lr = await vxFetchJson("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=" + encodeURIComponent(k), { method: "GET" }, 12000);
    if (lr.r.ok && lr.j.models) {
      names = lr.j.models
        .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf("generateContent") >= 0; })
        .map(function (m) { return String(m.name).replace(/^models\//, ""); })
        .filter(function (n) {
          return ((/^gemini-/.test(n) && /flash/.test(n)) || /^gemma-\d/.test(n)) &&
            !/image|tts|live|audio|embed|robotics|computer|vision|native|exp|preview-0|-it-qat|gemma-3n|gemma-2-/i.test(n);
        });
    }
  } catch (e1) {}
  names = names.filter(function (n, i) { return names.indexOf(n) === i; });
  var list = names.length ? vxGeminiRank(names)
    : ["gemini-3.8-flash", "gemini-3.8-flash-lite", "gemini-flash-lite-latest", "gemini-flash-latest", "gemini-3.7-flash"];
  if (names.length) { try { localStorage.setItem("VX_GEM_MODELS2", JSON.stringify({ t: Date.now(), list: list })); } catch (e2) {} }
  return list;
}

/* एक (key, model) कोशिश → {t:text} या {kind:"busy"|"dead"|"quota"|"key"} */
async function vxGeminiAttempt(k, model, prompt, ctrl, errs, label) {
  var is3 = /gemini-([3-9])/.test(model);
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(k);
  var cfgs = is3
    ? [{ maxOutputTokens: 2500, thinkingConfig: { thinkingLevel: "low" } }, { maxOutputTokens: 2500 }]
    : [{ temperature: 0.7, maxOutputTokens: 1400 }];
  var killer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 28000);
  try {
    for (var ci = 0; ci < cfgs.length; ci++) {
      var r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: cfgs[ci] }),
        signal: ctrl.signal
      });
      var j = await r.json().catch(function () { return {}; });
      if (r.ok) {
        var parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
        var t = parts.map(function (p) { return (p && !p.thought) ? (p.text || "") : ""; }).join("").trim();
        if (t && !vxIsBadStory(t)) return { t: t };
        errs.push(label + " " + model + ": खाली जवाब");
        return { kind: "busy" };
      }
      var msg = (j.error && j.error.message) || ("HTTP " + r.status);
      errs.push(label + " " + model + ": " + String(msg).slice(0, 55));
      if (r.status === 400 && ci < cfgs.length - 1 && !/api key|not valid/i.test(msg)) continue;
      if (vxGeminiIsKeyBad(r.status, msg)) return { kind: "key" };
      if (vxGeminiIsQuota(r.status, msg)) return { kind: "quota" };
      if (r.status === 404 || /no longer available|not found|not supported|deprecated/i.test(msg)) return { kind: "dead" };
      return { kind: "busy" };   /* 503 high demand, 500, timeout … बाद में फिर चल सकता है */
    }
  } catch (e) {
    if (!errs._won) errs.push(label + " " + model + ": " + (/abort/i.test(String(e)) ? "timeout" : String(e.message || e).slice(0, 40)));
    return { kind: "busy" };
  } finally { clearTimeout(killer); }
  return { kind: "busy" };
}

/* सारी (key, model) जोड़ियाँ साथ-साथ (हर 5 सेकंड में अगली, फेल हो तो तुरंत): जो पहले सही जवाब दे वही जीतता है */
function vxGeminiRace(pairs, keys, prompt, errs) {
  var stagger = (window.VX && VX.GEM_STAGGER) || 5000;
  return new Promise(function (resolve) {
    var next = 0, running = 0, done = false, ctrls = [], timer = null;
    function finish(res) {
      if (done) return;
      done = true; clearTimeout(timer);
      ctrls.forEach(function (c) { try { c.abort(); } catch (e) {} });
      resolve(res);
    }
    function launch() {
      if (done) return;
      if (next >= pairs.length) { if (running === 0) finish(null); return; }
      var p = pairs[next++];
      if (p.dead) { launch(); return; }
      var ctrl = new AbortController();
      ctrls.push(ctrl); running++;
      vxGeminiAttempt(keys[p.ki], p.m, p.prompt || prompt, ctrl, errs, "AI" + (p.ki + 1)).then(function (r) {
        running--;
        if (done) return;
        if (r.t) { errs._won = true; finish({ text: r.t, pair: p }); return; }
        if (r.kind === "dead") p.dead = true;
        if (r.kind === "key") keys.forEach(function (kk, i) { if (i === p.ki) pairs.forEach(function (q) { if (q.ki === i) q.dead = true; }); });
        launch();
      });
      clearTimeout(timer);
      if (next < pairs.length) timer = setTimeout(launch, stagger);
    }
    launch();
  });
}

/* Google AI 1/2/3 + कई models (नए, lite, Gemma) · भीड़ हो तो 3 राउंड में रुक-रुककर दोबारा */
async function vxCallGemini(system, user) {
  var keys = vxKeys().geminis;
  if (!keys.length) throw new Error("Google AI key नहीं");
  var start = parseInt(localStorage.getItem("VX_GEM_RR") || "0", 10) || 0;
  var order = [];
  for (var i = 0; i < keys.length; i++) order.push((start + i) % keys.length);
  var models = await vxGeminiModels(keys[order[0]]);
  var last = localStorage.getItem("VX_GEM_LAST");
  if (last && models.indexOf(last) > 0) { models = [last].concat(models.filter(function (m) { return m !== last; })); }
  models = models.slice(0, 6);
  var pairs = [];
  /* हर model को बारी-बारी से अलग key पर, फिर पहले 3 models दूसरी key पर भी */
  models.forEach(function (m, mi) { pairs.push({ m: m, ki: order[mi % order.length] }); });
  if (order.length > 1) models.slice(0, 3).forEach(function (m, mi) { pairs.push({ m: m, ki: order[(mi + 1) % order.length] }); });
  var prompt = system + "\n\n" + user;
  var errs = [], rounds = 3, wait = (window.VX && VX.GEM_WAIT) || 4000;

  for (var round = 0; round < rounds; round++) {
    pairs.forEach(function (p) { if (!p.dead && round > 0) p.dead = false; });
    var res = await vxGeminiRace(pairs, keys, prompt, errs);
    if (res) {
      try {
        localStorage.setItem("VX_GEM_RR", String((res.pair.ki + 1) % keys.length));
        localStorage.setItem("VX_GEM_LAST", res.pair.m);
      } catch (e) {}
      return res.text;
    }
    if (pairs.every(function (p) { return p.dead; })) break;
    if (round < rounds - 1) {
      vxGemStatus("Google AI अभी व्यस्त है · दोबारा कोशिश " + (round + 2) + "/" + rounds + "…");
      await new Promise(function (r) { setTimeout(r, wait * (round + 1)); });
    }
  }
  throw new Error("Google AI अभी बहुत व्यस्त है, कुछ देर बाद फिर दबाओ · " + errs.join(" | ").slice(0, 330));
}

function vxParseScenePack(raw) {
  var pack = [];
  try {
    var m = String(raw).match(/\[[\s\S]*\]/);
    if (m) {
      var arr = JSON.parse(m[0]);
      if (Array.isArray(arr)) {
        arr.forEach(function (o, i) {
          pack.push({
            n: i + 1,
            text: String(o.text || o.scene || o.dialogue || "").trim(),
            photo: String(o.photo_prompt || o.photo || "").trim(),
            video: String(o.video_prompt || o.video || "").trim()
          });
        });
      }
    }
  } catch (e) {}
  if (!pack.length) {
    String(raw).split(/\n+/).forEach(function (ln) {
      ln = ln.trim();
      if (!ln) return;
      if (/^(scene|सीन)\s*\d+/i.test(ln) || /^\d+[\.\)]/.test(ln)) {
        pack.push({
          n: pack.length + 1,
          text: ln.replace(/^(scene|सीन)\s*\d+[:\.\-\s]*/i, "").replace(/^\d+[\.\)]\s*/, ""),
          photo: "", video: ""
        });
      }
    });
  }
  return pack.slice(0, 6);
}

async function vxGoScenes() {
  if (!VX.story) { alert("पहले story"); return; }
  vxSetProg(true, 6, "Scenes…");
  try {
    var pack = [];
    try {
      var lock = "CRITICAL: Same characters every scene.";
      var raw = await vxCallAI(
        "Split into 4-6 scenes for 1-min video. Language " + vxLangName() + ". " + lock +
        ' JSON only: [{"text":"...","photo_prompt":"...","video_prompt":"..."}]',
        VX.story
      );
      pack = vxParseScenePack(raw);
    } catch (apiErr) {
      pack = [];
    }
    /* API fail → story से local scenes */
    if (!pack.length) {
      var parts = String(VX.story)
        .split(/(?<=[।.!?])\s+|\n+/)
        .map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 12; });
      if (parts.length < 2) {
        var mid = Math.floor(VX.story.length / 2);
        var br = VX.story.lastIndexOf("।", mid);
        if (br < 40) br = mid;
        parts = [VX.story.slice(0, br + 1).trim(), VX.story.slice(br + 1).trim()].filter(Boolean);
      }
      while (parts.length > 6) {
        var a = parts.pop();
        parts[parts.length - 1] += " " + a;
      }
      pack = parts.map(function (t, i) {
        return { n: i + 1, text: t, photo: "", video: "" };
      });
    }
    VX.scenePack = pack;
    VX.scenes = pack.map(function (p) { return p.text; });
    try {
      localStorage.setItem("VX_SCENES", JSON.stringify(VX.scenes));
      localStorage.setItem("VX_SCENE_PACK", JSON.stringify(pack));
      localStorage.setItem("VX_CREATE_STEP", "scenes_done");
    } catch (e) {}
    vxRenderScenes(pack);
  } catch (e) {
    alert(vxUserMsg(String(e.message || e)));
  } finally {
    vxSetProg(false);
  }
  }

function vxMatchPose(ent, pool, used) {
  var nm = (ent.name || "").toLowerCase();

/* Owner Gallery (owner-gallery.html) — VX_OWNER_GALLERY */
function vxOwnerLoad() {
  try {
    var j = JSON.parse(localStorage.getItem("VX_OWNER_GALLERY") || "null");
    if (j && j.chars && j.bgs) {
      if (!j.poses) j.poses = { "2d": {}, "3d": {} };
      return j;
    }
  } catch (e) {}
  return { chars: { "2d": {}, "3d": {} }, bgs: { "2d": {}, "3d": {} }, poses: { "2d": {}, "3d": {} } };
}
function vxOwnerSave(data) {
  try { localStorage.setItem("VX_OWNER_GALLERY", JSON.stringify(data)); } catch (e) {}
}
function vxStyleKey() {
  var st = (VX.style || localStorage.getItem("VX_STYLE") || "3d").toLowerCase();
  if (st === "2d") return "2d";
  return "3d"; /* 3d / real / mix → 3d pool */
}
function vxOwnerFlat(kind) {
  /* kind: "char" | "bg" — preferred style first, then other */
  var data = vxOwnerLoad();
  var sk = vxStyleKey();
  var branch = kind === "bg" ? data.bgs : (kind === "pose" ? (data.poses || {}) : data.chars);
  var out = [];
  var seen = {};
  function addStyle(s) {
    var cats = branch[s] || {};
    Object.keys(cats).forEach(function (cat) {
      (cats[cat] || []).forEach(function (it) {
        if (!it || !it.url || seen[it.url]) return;
        seen[it.url] = 1;
        out.push({
          url: it.url,
          name: it.name || cat,
          cat: cat,
          style: s,
          id: it.id || ("og_" + out.length)
        });
      });
    });
  }
  addStyle(sk);
  if (sk === "3d") addStyle("2d"); else addStyle("3d");
  return out;
}
function vxOwnerGalleryPush(item) {
  if (!item || !item.url) return;
  var data = vxOwnerLoad();
  var sk = vxStyleKey();
  var isBg = (item.type === "bg" || item.type === "background");
  var isPose = (item.type === "pose");
  if (isPose && !data.poses) data.poses = { "2d": {}, "3d": {} };
  var branch = isBg ? data.bgs : (isPose ? data.poses : data.chars);
  if (!branch[sk]) branch[sk] = {};
  var cat = (item.cat || item.name || (isBg ? "गाँव / घर" : "नॉर्मल")).toString().trim() || "नॉर्मल";
  if (!branch[sk][cat]) branch[sk][cat] = [];
  /* duplicate url skip */
  var arr = branch[sk][cat];
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] && arr[i].url === item.url) return;
  }
  arr.unshift({
    id: item.id || ("og_" + Date.now()),
    url: item.url,
    name: (item.name || cat).toString().slice(0, 40),
    style: sk,
    cat: cat,
    type: isBg ? "bg" : (isPose ? "pose" : "char"),
    ts: Date.now()
  });
  if (arr.length > 60) branch[sk][cat] = arr.slice(0, 60);
  vxOwnerSave(data);
}
function vxMatchOwnerPhoto(name, pool, used) {
  if (!pool || !pool.length) return null;
  var n = (name || "").toLowerCase();
  var i, it, cat, nm;
  /* 1) category / name exact-ish */
  for (i = 0; i < pool.length; i++) {
    it = pool[i];
    if (used[it.url]) continue;
    cat = (it.cat || "").toLowerCase();
    nm = (it.name || "").toLowerCase();
    if (n && (cat.indexOf(n) >= 0 || n.indexOf(cat) >= 0 || nm.indexOf(n) >= 0 || n.indexOf(nm) >= 0)) {
      used[it.url] = 1;
      return it;
    }
  }
  /* 2) कोई भी बची हुई photo */
  for (i = 0; i < pool.length; i++) {
    it = pool[i];
    if (used[it.url]) continue;
    used[it.url] = 1;
    return it;
  }
  return null;
}

function vxGuessCharsFromStory() {
  var story = VX.story || localStorage.getItem("VX_STORY") || "";
  var pack = VX.scenePack || [];
  var names = [];
  var seen = {};
  var blob = story + " " + pack.map(function (p) { return p.text || ""; }).join(" ");
  var candidates = ["किसान", "रामु", "राम", "पति", "पत्नी", "बच्चा", "बच्चे", "व्यापारी", "महिला", "बुज़ुर्ग", "खलनायक", "नॉर्मल", "Farmer", "Villager", "Child", "Children", "Wife", "Trader"];
  candidates.forEach(function (c) {
    if (blob.indexOf(c) >= 0 && !seen[c]) {
      seen[c] = 1;
      names.push(c);
    }
  });
  /* Owner gallery categories भी नाम के रूप में */
  var pool = vxOwnerFlat("char");
  var catSeen = {};
  pool.forEach(function (p) {
    if (p.cat && !catSeen[p.cat]) {
      catSeen[p.cat] = 1;
      if (blob.indexOf(p.cat) >= 0 && !seen[p.cat]) {
        seen[p.cat] = 1;
        names.push(p.cat);
      }
    }
  });
  if (!names.length) {
    /* gallery से top categories / फोटो नाम */
    if (pool.length) {
      pool.slice(0, 4).forEach(function (p) {
        var label = p.cat || p.name || "पात्र";
        if (!seen[label]) { seen[label] = 1; names.push(label); }
      });
    } else {
      names = ["मुख्य पात्र", "सह पात्र"];
    }
  }
  if (names.length > 4) names = names.slice(0, 4);
  /* अगर story से 1 नाम और gallery में बहुत फोटो — 2–3 slot भरें */
  if (names.length < 2 && pool.length >= 2) {
    pool.forEach(function (p) {
      if (names.length >= 3) return;
      var label = p.cat || p.name;
      if (label && !seen[label]) { seen[label] = 1; names.push(label); }
    });
  }
  var used = {};
  return names.map(function (n, i) {
    var hit = vxMatchOwnerPhoto(n, pool, used);
    return {
      id: "c" + i,
      name: n,
      type: "char",
      url: hit ? hit.url : "",
      locked: !!(hit && hit.url),
      prompt: n + " character portrait, consistent face clothes",
      fromOwner: !!hit
    };
  });
}

function vxGuessBgs() {
  var pool = vxOwnerFlat("bg");
  var used = {};
  var defaults = [
    { id: "b0", name: "घर / गाँव", type: "bg", prompt: "rural village house, cinematic" },
    { id: "b1", name: "खेत", type: "bg", prompt: "farm field crops, cinematic" },
    { id: "b2", name: "बाजार / रास्ता", type: "bg", prompt: "village path market, cinematic" }
  ];
  return defaults.map(function (d, i) {
    var hit = vxMatchOwnerPhoto(d.name, pool, used);
    if (!hit && pool[i]) {
      hit = pool[i];
      if (hit && !used[hit.url]) used[hit.url] = 1;
      else hit = null;
    }
    return {
      id: d.id,
      name: d.name,
      type: "bg",
      url: hit ? hit.url : "",
      locked: !!(hit && hit.url),
      prompt: d.prompt,
      fromOwner: !!hit
    };
  });
}

function vxBuildImageUrl(prompt) {

function vxRenderEntityGrid(gridId, list) {
  var grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = "";
  list.forEach(function (ent, idx) {
    var card = document.createElement("div");
    card.className = "char-card" + (ent.locked ? " locked" : "");
    card.setAttribute("data-id", ent.id);
    card.innerHTML =
      '<button type="button" class="char-dl" title="Download">⬇</button>' +
      '<div class="char-preview">' +
      (ent.url ? '<img alt=""/>' : '<span class="ph">' + (ent.type === "bg" ? "🏞️" : (ent.type === "pose" ? "🧍" : "👤")) + "</span>") +
      "</div>" +
      '<div class="char-meta"><div class="nm"></div><div class="char-btns">' +
      '<button type="button" data-act="ai">AI</button>' +
      '<button type="button" data-act="gal">Gallery</button>' +
      '<button type="button" data-act="lock" class="lock-btn' + (ent.locked ? " on" : "") + '">Lock</button>' +
      "</div></div>";
    card.querySelector(".nm").textContent = ent.name;
    if (ent.url) {
      var im = card.querySelector("img");
      im.src = ent.url;
      im.onclick = function () { vxZoom(ent.url); };
    }
    card.querySelector(".char-dl").onclick = function (e) {
      e.stopPropagation();
      if (!ent.url) { alert("पहले AI या Gallery से photo लगाओ"); return; }
      var a = document.createElement("a");
      a.href = ent.url;
      a.download = (ent.name || "velorix") + ".jpg";
      a.target = "_blank";
      a.rel = "noopener";
      a.click();
    };
    card.querySelector('[data-act="ai"]').onclick = function () {
      if (ent.locked) { alert("Lock है · पहले Unlock करो"); return; }
      vxGenEntityImage(list, idx, gridId);
    };
    card.querySelector('[data-act="gal"]').onclick = function () {
      if (ent.locked) { alert("Lock है · पहले Unlock करो"); return; }
      VX._pickTarget = { list: list, idx: idx, gridId: gridId };
      document.getElementById("imgFilePick").click();
    };
    card.querySelector('[data-act="lock"]').onclick = function () {
      ent.locked = !ent.locked;
      try {
        localStorage.setItem("VX_CHARS", JSON.stringify(VX.chars));
        localStorage.setItem("VX_BGS", JSON.stringify(VX.bgs));
        localStorage.setItem("VX_POSES", JSON.stringify(VX.poses || []));
      } catch (e) {}
      vxRenderEntityGrid(gridId, list);
    };
    grid.appendChild(card);
  });
}

function vxGenEntityImage(list, idx, gridId) {
  var ent = list[idx];
  if (!ent) return;
  vxSetProg(true, 10, "Photo…");
  var url = vxBuildImageUrl(ent.prompt || ent.name);
  var img = new Image();
  img.onload = function () {
    ent.url = url;
    vxGallerySave({
      id: "g_" + Date.now(),
      url: url,
      name: ent.name,
      type: ent.type,
      best: (VX.quality === "max" || VX.quality === "high"),
      ts: Date.now()
    });
    try {
      localStorage.setItem("VX_CHARS", JSON.stringify(VX.chars));
      localStorage.setItem("VX_BGS", JSON.stringify(VX.bgs));
        localStorage.setItem("VX_POSES", JSON.stringify(VX.poses || []));
    } catch (e) {}
    vxSetProg(false);
    vxRenderEntityGrid(gridId, list);
  };
  img.onerror = function () {
    vxSetProg(false);
    alert("Photo load fail · फिर AI दबाओ");
  };
  img.src = url;
}

document.getElementById("imgFilePick").onchange = function (ev) {
  var f = ev.target.files && ev.target.files[0];

  var reader = new FileReader();
  reader.onload = function () {

    if (!ent) return;
    ent.url = data;
    vxGallerySave({ id: "g_" + Date.now(), url: data, name: ent.name, type: ent.type, best: true, ts: Date.now(), source: "gallery" });
    try {
      localStorage.setItem("VX_CHARS", JSON.stringify(VX.chars));
      localStorage.setItem("VX_BGS", JSON.stringify(VX.bgs));
        localStorage.setItem("VX_POSES", JSON.stringify(VX.poses || []));
    } catch (e) {}
    vxRenderEntityGrid(t.gridId, t.list);
  };
  reader.readAsDataURL(f);
};

          } catch (e1) { go(); }
        };
        rq.onerror = go;
      } catch (e2) { go(); }
    };
  }

/* Image keys — API Center से; PART 4 में full wire */
window.vxGetImageKeys = function () {
  var out = [];
  var names = ["VX_IMAGE_KEYS", "VX_IMG_KEYS", "velorix_image_keys", "VX_API_IMAGE"];
  for (var i = 0; i < names.length; i++) {
    try {
      var raw = localStorage.getItem(names[i]);
      if (!raw) continue;
      var j = JSON.parse(raw);
      if (Array.isArray(j)) out = j;
      else if (j && typeof j === "object") {
        Object.keys(j).forEach(function (k) {
          out.push({ name: k, key: j[k] });
        });
      }
      if (out.length) break;
    } catch (e) {}
  }
  /* single keys optional */
  ["VX_REPLICATE", "VX_FAL", "VX_TOGETHER"].forEach(function (k) {
    try {
      var v = localStorage.getItem(k);
      if (v && v.length > 8) out.push({ name: k.replace("VX_", ""), key: v });
    } catch (e2) {}
  });
  return out.filter(function (x) { return x && x.key; });
};

/* Better names from story */
window.vxGuessCharsFromStory = function () {
  var ctx = vxStoryContext();
  var blob = ctx.blob || "";
  var found = [];
  var seen = {};
  function add(n) {
    n = (n || "").trim();
    if (!n || seen[n]) return;
    seen[n] = 1;
    found.push(n);
  }
  /* English proper-ish */
  var m;
  var re = /\b([A-Z][a-z]{2,}(?:\s+[A-Z][a-z]+)?)\b/g;
  while ((m = re.exec(blob)) && found.length < 6) {
    if (!/^(The|And|But|For|With|From|This|That|When|After|Scene)$/.test(m[1])) add(m[1]);
  }
  /* Hindi common roles */
  ["रामू", "रामु", "गुड़िया", "साहूकार", "किसान", "पत्नी", "बीवी", "बच्चे", "बच्चा", "व्यापारी", "अधिकारी", "सरपंच", "डॉक्टर", "Ramu", "Farmer", "Wife", "Children", "Trader", "Official"].forEach(function (c) {
    if (blob.indexOf(c) >= 0) add(c);
  });
  if (found.some(function (x) { return /^(रामू|रामु|Ramu)$/.test(x); })) {
    found = found.filter(function (x) { return x !== "किसान" && x !== "Farmer"; });
  }
  if (found.indexOf("पत्नी") >= 0 && found.indexOf("बीवी") >= 0) found = found.filter(function (x) { return x !== "बीवी"; });
  if (found.indexOf("बच्चे") >= 0 && found.indexOf("बच्चा") >= 0) found = found.filter(function (x) { return x !== "बच्चा"; });
  if (!found.length) found = ["मुख्य पात्र", "सह पात्र"];
  if (found.length > 5) found = found.slice(0, 5);
  return found.map(function (n, i) {
    return {
      id: "c" + i,
      name: n,
      type: "char",
      url: "",
      locked: false,
      prompt: n + " character from the story, consistent face clothes age"
    };
  });
};

window.vxFillEmptyFromOwner = function () {
  if (!window.VX) return;

  function keyOf(u) { return String(u.length) + ":" + u.slice(-60); }

    var hit = typeof vxMatchOwnerPhoto === "function" ? vxMatchOwnerPhoto(ent.name || "", pool, used) : null;
    if (!hit) {
      for (var i = 0; i < pool.length; i++) {
        if (pool[i] && pool[i].url && !used[pool[i].url]) { hit = pool[i]; break; }
      }
    }
    return hit;

  function fill(list, pool) {
    if (!list || !list.length || !pool.length) return;

    list.forEach(function (en) { if (en && en.url) used[en.url] = 1; });

    VX.bgs = typeof vxGuessBgs === "function" ? vxGuessBgs() : [];

        .then(function (j) {

            if (Array.isArray(out) && out[0]) return out[0];
            if (typeof out === "string") return out;

          if (j.status === "failed" || j.status === "canceled") throw new Error("Replicate failed");

if (prov === "unknown") {

}
/* unknown → तीनों try */

return job.catch(function () { return trySlot(i + 1); });

/* ===== VELORIX PHOTO — Public Pollinations + Mobile Gallery ===== */
const VX_GAL_KEY = "vx_gallery_v1";

function loadGal() {
  try { return JSON.parse(localStorage.getItem(VX_GAL_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveGal(list) {
  try { localStorage.setItem(VX_GAL_KEY, JSON.stringify(list.slice(0, 40))); } catch (e) {}
}

/* Public image — no API key */
function pollinationsUrl(prompt, w, h) {
  const p = encodeURIComponent(String(prompt || "cinematic character").slice(0, 300));
  const seed = Math.floor(Math.random() * 999999);
  return "https://image.pollinations.ai/prompt/" + p +
    "?width=" + (w || 768) +
    "&height=" + (h || 768) +
    "&nologo=true&enhance=true&seed=" + seed;
}

function waitImg(url, ms) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    let done = false;
    const t = setTimeout(function () {
      if (!done) { done = true; reject(new Error("timeout")); }
    }, ms || 90000);
    img.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(t);
      resolve(url);
    };
    img.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(t);
      reject(new Error("load fail"));
    };
    img.crossOrigin = "anonymous";
    img.src = url;
  });
}

async function genPublicPhoto(prompt) {
  const url = pollinationsUrl(prompt, 768, 768);
  await waitImg(url, 90000);
  return url;
}

/* Mobile / file → Gallery save */
function pickPhotoFile() {
  return new Promise(function (resolve) {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = function () {
      const f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (!f) return resolve(null);
      const r = new FileReader();
      r.onload = function () {
        const data = r.result;
        const list = loadGal();
        list.unshift({
          id: "g_" + Date.now(),
          url: data,
          name: f.name || "photo",
          t: Date.now()
        });
        saveGal(list);
        resolve(data);
      };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(f);
    };
    inp.click();
  });
}
