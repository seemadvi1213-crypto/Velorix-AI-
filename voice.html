<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velorix AI — Voice</title>
  <style>
    :root{
      --bg:#07060c;--card:rgba(24,20,40,.92);--border:rgba(167,139,250,.22);
      --p:#7c3aed;--p2:#a78bfa;--p3:#c4b5fd;--t:#f4f0ff;--mut:rgba(244,240,255,.55);
      --ok:#34d399;--danger:#f87171;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--t);min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%,rgba(124,58,237,.35),transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%,rgba(236,72,153,.12),transparent 50%);
    }
    .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 14px;
      background:rgba(7,6,12,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .top a.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.05);color:var(--t);font-size:16px;display:flex;align-items:center;
      justify-content:center;text-decoration:none}
    .top h1{flex:1;text-align:center;font-size:16px;font-weight:700;
      background:linear-gradient(90deg,#fff,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .pill{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--border);
      color:var(--p2);background:rgba(124,58,237,.15)}
    .wrap{padding:14px 14px 120px;max-width:480px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
    .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin-bottom:10px}
    .seg{display:flex;gap:8px}
    .seg button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.05);color:var(--t);font-weight:700;font-size:14px;cursor:pointer}
    .seg button.on{background:linear-gradient(135deg,var(--p),#9333ea);border-color:transparent}
    select{width:100%;margin-top:10px;min-height:44px;border-radius:12px;border:1px solid var(--border);
      background:#120e22;color:var(--t);font-size:14px;padding:0 10px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chips button{padding:10px 14px;border-radius:999px;border:1px solid var(--border);
      background:rgba(255,255,255,.05);color:var(--t);font-size:13px;font-weight:600;cursor:pointer}
    .chips button.on{background:rgba(124,58,237,.35);border-color:var(--p2)}
    .chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:2px}
    .chk input{width:20px;height:20px}
    .scene{font-size:12px;color:var(--mut);line-height:1.5;padding:8px 0;border-top:1px solid rgba(167,139,250,.12)}
    .scene b{color:var(--p3)}
    .row{display:flex;gap:10px;margin-top:10px}
    .btn{flex:1;min-height:50px;border:none;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;padding:12px}
    .btn-main{background:linear-gradient(135deg,var(--p),#9333ea);color:#fff;box-shadow:0 10px 28px rgba(124,58,237,.35)}
    .btn-ghost{background:rgba(255,255,255,.06);color:var(--t);border:1px solid var(--border)}
    .btn-ok{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
    .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
    .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
    .bar i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--p),#ec4899);transition:width .25s}
    .prog{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
    .prog b{color:var(--p3)}
    .err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;word-break:break-word;line-height:1.5}
    .warn{color:#fbbf24;font-size:12px;margin-top:8px;line-height:1.5}
    .hint{font-size:12px;color:var(--mut);line-height:1.5}
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="video.html" title="Video">←</a>
    <h1>Velorix · Voice</h1>
    <span class="pill" id="pill">—</span>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="lbl">आवाज़</div>
      <div class="seg">
        <button id="gM" class="on" type="button">पुरुष</button>
        <button id="gF" type="button">महिला</button>
      </div>
      <select id="voiceSel"></select>
    </div>

    <div class="card">
      <div class="lbl">अंदाज़</div>
      <div class="chips" id="styles"></div>
    </div>

    <div class="card">
      <label class="chk"><input type="checkbox" id="music" checked /> बैकग्राउंड म्यूज़िक (कहानी के हिसाब से अपने-आप)</label>
      <div class="hint" style="margin-top:8px">म्यूज़िक हल्का रहता है और आवाज़ के नीचे दबा रहता है। न बने तो वीडियो सिर्फ़ आवाज़ के साथ चलेगा।</div>
    </div>

    <div class="card">
      <div class="prog"><span id="progText">तैयार</span><b id="progPct">0%</b></div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="row">
        <button class="btn btn-main" id="btnGen" type="button">आवाज़ बनाओ</button>
        <button class="btn btn-ghost" id="btnPlay" type="button" disabled>▶ सुनो</button>
      </div>
      <div class="err" id="err"></div>
      <div class="warn" id="warn"></div>
      <div id="scenes" style="margin-top:8px"></div>
    </div>

    <button class="btn btn-ok" id="btnNext" type="button" style="width:100%;min-height:54px" disabled>Save → Video पर जाओ</button>
  </div>

<script>
(function () {
  var MODELS = ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts"];
  var API = "https://generativelanguage.googleapis.com/v1beta/interactions";
  var WPS = 2.4;
  var VOICES = {
    M: [["Charon", "Charon · गहरी, जानकार"], ["Algenib", "Algenib · भारी, खुरदुरी"], ["Orus", "Orus · दमदार"]],
    F: [["Sulafat", "Sulafat · गरम, मीठी"], ["Vindemiatrix", "Vindemiatrix · नरम"], ["Kore", "Kore · साफ़, मज़बूत"]]
  };
  var STYLES = {
    "भावुक": { tts: "warm, emotional Hindi storyteller, gentle and a little slow, with heartfelt feeling",
               music: "Instrumental only, no vocals. Soft emotional Indian folk background music for a touching Hindi village story: gentle piano, warm bansuri flute, light strings, slow tempo, no drums, very calm and quiet." },
    "जोशीला": { tts: "energetic, inspiring Hindi narrator, confident pace, rising excitement",
                music: "Instrumental only, no vocals. Uplifting cinematic Indian background music: light dhol and tabla, hopeful strings and flute, medium tempo, positive and motivating, not too loud." },
    "रहस्य": { tts: "low, mysterious, suspenseful Hindi narrator, slightly slower, hushed",
               music: "Instrumental only, no vocals. Dark ambient suspense background music: low drones, sparse sitar plucks, soft pulse, quiet and tense." },
    "सहज": { tts: "", music: "Instrumental only, no vocals. Light warm acoustic guitar and flute, relaxed friendly background music, soft and simple." }
  };
  var S = { gender: "M", voice: "Charon", style: "भावुक", scenes: [], music: null, hash: "", busy: false, ac: null, nodes: [] };

  function $(id) { return document.getElementById(id); }
  function setProg(p, m) { $("progBar").style.width = p + "%"; $("progPct").textContent = Math.round(p) + "%"; if (m) $("progText").textContent = m; }
  function err(m) { $("err").textContent = m || ""; }

  /* ---------- storage ---------- */
  function idbOpen() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open("velorix", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var g = db.transaction("kv", "readonly").objectStore("kv").get(key);
          g.onsuccess = function () { res(g.result || null); };
          g.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function idbSet(key, val) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var tx = db.transaction("kv", "readwrite");
          tx.objectStore("kv").put(val, key);
          tx.oncomplete = function () { res(true); };
          tx.onerror = function () { res(false); };
          tx.onabort = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }

  /* ---------- keys (Google AI 1/2/3) ---------- */
  function geminiKeys() {
    var raw = [];
    try {
      JSON.parse(localStorage.getItem("VX_STORY_KEYS") || "[]").forEach(function (it) {
        if (it && it.key && (it.provider === "gemini" || /gemini|google/i.test(it.name || "") || /^AIza/.test(it.key))) raw.push(it.key);
      });
    } catch (e0) {}
    ["VX_GEMINI", "VX_GEMINI2", "VX_GEMINI3", "VX_GEMINI_1", "VX_GEMINI_2", "VX_GEMINI_3"].forEach(function (n) {
      raw.push(localStorage.getItem(n) || "");
    });
    var seen = {}, list = [];
    raw.join(" ").split(/[\s,;|]+/).forEach(function (x) {
      x = x.trim();
      if (x.length >= 20 && !seen[x]) { seen[x] = 1; list.push(x); }
    });
    return list;
  }

  /* ---------- story → scenes (same rules as video.html) ---------- */
  function normStory(t) { return String(t || "").replace(/[*#_`]/g, "").replace(/\s+/g, " ").trim(); }
  function hashStr(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(16) + "-" + str.length;
  }
  function wc(t) { return String(t || "").trim().split(/\s+/).filter(Boolean).length; }
  function splitScenes(rawStory) {
    var story = String(rawStory || "").replace(/[*#_`]/g, "").trim();
    var paras = story.split(/\n+/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 3; });
    var texts = [];
    if (paras.length >= 2) {
      texts = paras.slice();
      while (texts.length > 6) {
        var bi = 0, bv = 1e9;
        for (var m = 0; m < texts.length - 1; m++) {
          var v = wc(texts[m]) + wc(texts[m + 1]);
          if (v < bv) { bv = v; bi = m; }
        }
        texts.splice(bi, 2, texts[bi] + " " + texts[bi + 1]);
      }
    } else {
      var sents = story.replace(/\n+/g, " ").split(/(?<=[।.!?])\s+/).filter(function (x) { return x.trim().length > 2; });
      var n = Math.max(1, Math.min(6, Math.round((wc(story) / WPS) / 6)));
      if (sents.length < n) n = Math.max(1, sents.length);
      for (var c = 0; c < n; c++) {
        var f = Math.round(c * sents.length / n), t = Math.round((c + 1) * sents.length / n);
        var part = sents.slice(f, t).join(" ").trim();
        if (part) texts.push(part);
      }
    }
    return texts.slice(0, 6);
  }

  /* ---------- Gemini calls ---------- */
  function b64ToBuf(b64) {
    var bin = atob(b64), len = bin.length, u = new Uint8Array(len);
    for (var i = 0; i < len; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  function pickAudio(j) {
    var out = null, steps = (j && j.steps) || [];
    steps.forEach(function (st) {
      if (st && st.type === "model_output" && st.content) {
        st.content.forEach(function (c) { if (c && c.type === "audio" && c.data) out = c.data; });
      }
    });
    if (!out && j && j.output_audio && j.output_audio.data) out = j.output_audio.data;
    return out;
  }
  function isQuota(status, msg) { return status === 429 || /quota|rate|exhausted|limit/i.test(String(msg || "")); }
  function isKeyBad(status, msg) { return status === 401 || status === 403 || /api key|api_key|permission|billing|not valid|expired/i.test(String(msg || "")); }

  async function post(key, body, ms) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 60000);
    try {
      var r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify(body),
        signal: ctrl ? ctrl.signal : undefined
      });
      var j = await r.json().catch(function () { return {}; });
      return { r: r, j: j };
    } finally { clearTimeout(timer); }
  }

  /* one request, rotating over all keys and the two TTS models */
  async function callAudio(buildBody, label) {
    var keys = geminiKeys();
    if (!keys.length) throw new Error("Google AI key नहीं · api.html में डालो");
    var start = parseInt(localStorage.getItem("VX_VOICE_RR") || "0", 10) || 0;
    var errs = [];
    for (var ki = 0; ki < keys.length; ki++) {
      var idx = (start + ki) % keys.length;
      var models = buildBody.models;
      for (var mi = 0; mi < models.length; mi++) {
        try {
          var res = await post(keys[idx], buildBody.make(models[mi]), buildBody.ms);
          if (res.r.ok) {
            var data = pickAudio(res.j);
            if (data) {
              try { localStorage.setItem("VX_VOICE_RR", String((idx + 1) % keys.length)); } catch (e) {}
              return b64ToBuf(data);
            }
            errs.push("AI" + (idx + 1) + " " + models[mi] + ": ऑडियो नहीं आया");
            continue;
          }
          var msg = (res.j.error && res.j.error.message) || ("HTTP " + res.r.status);
          errs.push("AI" + (idx + 1) + " " + models[mi] + ": " + String(msg).slice(0, 70));
          if (isQuota(res.r.status, msg) || isKeyBad(res.r.status, msg)) break;
        } catch (e) {
          errs.push("AI" + (idx + 1) + ": " + (/abort/i.test(String(e)) ? "timeout" : String(e.message || e).slice(0, 50)));
        }
      }
    }
    throw new Error((label || "") + errs.join(" | ").slice(0, 380));
  }

  function ttsOne(text, voice, style) {
    var annot = { type: "speech_metadata" };
    if (style) annot.style = style;
    return callAudio({
      models: MODELS, ms: 70000,
      make: function (model) {
        return {
          model: model,
          input: [{ type: "user_input", content: [{ type: "text", text: text, annotations: [annot] }] }],
          response_format: { type: "audio" },
          generation_config: { speech_config: [{ voice: voice }] }
        };
      }
    }, "आवाज़: ");
  }
  function musicOne(prompt) {
    return callAudio({
      models: ["lyria-3-clip-preview"], ms: 90000,
      make: function (model) { return { model: model, input: prompt }; }
    }, "म्यूज़िक: ");
  }

  /* ---------- audio helpers ---------- */
  function getAC() {
    if (!S.ac) S.ac = new (window.AudioContext || window.webkitAudioContext)();
    if (S.ac.state === "suspended" && S.ac.resume) S.ac.resume();
    return S.ac;
  }
  function decode(buf) {
    var ac = getAC();
    return new Promise(function (res, rej) {
      var copy = buf.slice(0);
      var p = ac.decodeAudioData(copy, res, rej);
      if (p && p.then) p.then(res, rej);
    });
  }

  /* ---------- generate ---------- */
  async function generate() {
    if (S.busy) return;
    err(""); $("warn").textContent = "";
    var ho = await idbGet("VX_HANDOFF");
    var story = (ho && ho.story) || localStorage.getItem("VX_STORY") || "";
    if (!story.trim()) { err("पहले कहानी बनाओ (Create)"); return; }
    var texts = splitScenes(story);
    if (!texts.length) { err("कहानी बहुत छोटी है"); return; }
    S.busy = true; $("btnGen").disabled = true; $("btnPlay").disabled = true; $("btnNext").disabled = true;
    S.scenes = []; S.music = null; S.hash = hashStr(normStory(story));
    var st = STYLES[S.style] || STYLES["सहज"];
    try {
      for (var i = 0; i < texts.length; i++) {
        setProg(4 + (i / texts.length) * 70, "आवाज़ " + (i + 1) + "/" + texts.length + "…");
        var buf = await ttsOne(texts[i], S.voice, st.tts);
        var ab = await decode(buf);
        S.scenes.push({ text: texts[i], audio: buf, audioDur: ab.duration, sec: ab.duration + (i === texts.length - 1 ? 0.6 : 0.7) });
        renderScenes();
      }
      if ($("music").checked) {
        setProg(78, "म्यूज़िक बन रहा है…");
        try {
          var mb = await musicOne(st.music + " Fits this story: " + normStory(story).slice(0, 160));
          await decode(mb);
          S.music = mb;
        } catch (e) {
          $("warn").textContent = "म्यूज़िक नहीं बन पाया (" + String(e.message || e).slice(0, 140) + ") · वीडियो सिर्फ़ आवाज़ के साथ चलेगा।";
        }
      }
      var ok = await idbSet("VX_VOICE", { hash: S.hash, ts: Date.now(), voice: S.voice, style: S.style, scenes: S.scenes, music: S.music });
      if (!ok) err("आवाज़ सेव नहीं हो पाई (browser storage)");
      setProg(100, "तैयार" + (ok ? " · सेव हो गई" : ""));
      $("btnPlay").disabled = false; $("btnNext").disabled = !ok;
    } catch (e) {
      err(String(e.message || e));
      setProg(0, "रुक गया");
    } finally {
      S.busy = false; $("btnGen").disabled = false;
      renderScenes();
    }
  }

  function totalSec() { var t = 0; S.scenes.forEach(function (s) { t += s.sec; }); return t; }
  function renderScenes() {
    var box = $("scenes"); box.innerHTML = "";
    S.scenes.forEach(function (s, i) {
      var d = document.createElement("div");
      d.className = "scene";
      var b = document.createElement("b"); b.textContent = "Scene " + (i + 1) + " · " + s.audioDur.toFixed(1) + "s  ";
      d.appendChild(b); d.appendChild(document.createTextNode(s.text.slice(0, 80) + (s.text.length > 80 ? "…" : "")));
      box.appendChild(d);
    });
    var t = totalSec();
    $("pill").textContent = S.scenes.length ? Math.round(t) + "s" : "—";
    if (t > 30.5) $("warn").textContent = "आवाज़ " + Math.round(t) + " सेकंड की बनी है (30 से ज़्यादा) · कहानी थोड़ी छोटी करके फिर बनाओ।";
  }

  /* ---------- preview ---------- */
  function stopPlay() {
    S.nodes.forEach(function (n) { try { n.stop(); } catch (e) {} });
    S.nodes = [];
    $("btnPlay").textContent = "▶ सुनो";
  }
  async function play() {
    if (S.nodes.length) { stopPlay(); return; }
    if (!S.scenes.length) return;
    var ac = getAC();
    var t0 = ac.currentTime + 0.1, at = 0;
    for (var i = 0; i < S.scenes.length; i++) {
      var ab = await decode(S.scenes[i].audio);
      var src = ac.createBufferSource(); src.buffer = ab; src.connect(ac.destination);
      src.start(t0 + at + 0.15); S.nodes.push(src);
      at += S.scenes[i].sec;
    }
    if (S.music) {
      var mb = await decode(S.music);
      var ms = ac.createBufferSource(); ms.buffer = mb; ms.loop = true;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.13, t0 + 1.5);
      g.gain.setValueAtTime(0.13, t0 + Math.max(2, at - 1.5));
      g.gain.linearRampToValueAtTime(0.0001, t0 + at);
      ms.connect(g); g.connect(ac.destination);
      ms.start(t0); ms.stop(t0 + at + 0.05); S.nodes.push(ms);
    }
    $("btnPlay").textContent = "■ रोको";
    setTimeout(function () { if (S.nodes.length) stopPlay(); }, (at + 0.5) * 1000);
  }

  /* ---------- UI ---------- */
  function fillVoices() {
    var sel = $("voiceSel"); sel.innerHTML = "";
    VOICES[S.gender].forEach(function (v) {
      var o = document.createElement("option"); o.value = v[0]; o.textContent = v[1]; sel.appendChild(o);
    });
    S.voice = VOICES[S.gender][0][0];
    sel.value = S.voice;
  }
  function fillStyles() {
    var box = $("styles"); box.innerHTML = "";
    Object.keys(STYLES).forEach(function (k) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = k;
      if (k === S.style) b.className = "on";
      b.onclick = function () { S.style = k; fillStyles(); };
      box.appendChild(b);
    });
  }
  $("gM").onclick = function () { S.gender = "M"; $("gM").className = "on"; $("gF").className = ""; fillVoices(); };
  $("gF").onclick = function () { S.gender = "F"; $("gF").className = "on"; $("gM").className = ""; fillVoices(); };
  $("voiceSel").onchange = function () { S.voice = this.value; };
  $("btnGen").onclick = generate;
  $("btnPlay").onclick = play;
  $("btnNext").onclick = function () { stopPlay(); window.location.href = "video.html"; };

  fillVoices(); fillStyles();

  /* show an already-saved voice for the current story */
  (async function () {
    var ho = await idbGet("VX_HANDOFF");
    var story = (ho && ho.story) || localStorage.getItem("VX_STORY") || "";
    var v = await idbGet("VX_VOICE");
    if (v && story && v.hash === hashStr(normStory(story))) {
      S.scenes = v.scenes || []; S.music = v.music || null; S.hash = v.hash;
      S.voice = v.voice || S.voice; S.style = v.style || S.style;
      fillStyles(); renderScenes();
      setProg(100, "इस कहानी की आवाज़ तैयार है");
      $("btnPlay").disabled = false; $("btnNext").disabled = false;
    }
  })();

  window.__v = { splitScenes: splitScenes, hashStr: hashStr, normStory: normStory, pickAudio: pickAudio, callAudio: callAudio, ttsOne: ttsOne, geminiKeys: geminiKeys, S: S };
})();
</script>
</body>
</html>
