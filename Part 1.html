<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REELIFY AI</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 32px;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #a1a1aa;
      margin-bottom: 40px;
      font-size: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      backdrop-filter: blur(12px);
    }

    .google-btn {
      width: 100%;
      background: white;
      color: #222;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
    }

    .note {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }

    .error {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    /* Dashboard Styles */
    .dashboard {
      display: none;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #a1a1aa;
      font-size: 14px;
    }

    .menu-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: left;
    }

    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ========== LOGIN SCREEN ========== -->
  <div class="container" id="loginScreen">
    <h1>REELIFY AI</h1>
    <p class="subtitle">Premium AI Short Video Studio</p>

    <div class="card">
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Google से लॉगिन करें
      </button>

      <p class="note">फोन OTP ऑप्शन जल्द जोड़ा जाएगा</p>
      <div class="error" id="errorMsg"></div>
    </div>
  </div>

  <!-- ========== DASHBOARD SCREEN ========== -->
  <div class="container dashboard" id="dashboardScreen">
    <div class="welcome">
      <h2 id="userName">स्वागत है</h2>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <button class="menu-btn">+ नई वीडियो बनाएं</button>
      <button class="menu-btn">मेरी वीडियोस</button>
      <button class="menu-btn">प्रीमियम</button>
      <button class="menu-btn">सेटिंग्स</button>

      <button class="logout-btn" onclick="logout()">लॉगआउट</button>
    </div>
  </div>

  <script>
    // Firebase Config (तुम्हारी Keys)
    const firebaseConfig = {
      apiKey: "AIzaSyBwFnbJoKUIDSmyl96EewCGMXg2oVnXot4",
      authDomain: "best-47108.firebaseapp.com",
      projectId: "best-47108",
      storageBucket: "best-47108.firebasestorage.app",
      messagingSenderId: "995954423710",
      appId: "1:995954423710:web:9b3458af61b99e6fb6088f",
      measurementId: "G-CPCRTBG42V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Google Login
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();

      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          showDashboard(user);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("errorMsg").style.display = "block";
          document.getElementById("errorMsg").innerText = "लॉगिन में समस्या आई";
        });
    }

    // Dashboard दिखाना
    function showDashboard(user) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardScreen").style.display = "flex";

      document.getElementById("userName").innerText = "नमस्ते, " + (user.displayName || "यूजर");
      document.getElementById("userEmail").innerText = user.email;
    }

    // Logout
    function logout() {
      auth.signOut().then(() => {
        document.getElementById("dashboardScreen").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
      });
    }

    // पहले से लॉगिन चेक करना
    auth.onAuthStateChanged((user) => {
      if (user) {
        showDashboard(user);
      }
    });
  </script>

</body>
</html>
