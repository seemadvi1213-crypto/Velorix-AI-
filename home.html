<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Velorix AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0618;color:#fff;min-height:100vh;overflow-x:hidden}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;position:sticky;top:0;z-index:50;background:rgba(11,6,24,.92);backdrop-filter:blur(12px)}
.logo{font-size:20px;font-weight:700;background:linear-gradient(90deg,#c084fc,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.main{padding:12px 16px 90px}
.prompt-box{background:linear-gradient(145deg,#1a102e,#120c22);border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:16px;margin-bottom:22px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
textarea{width:100%;min-height:110px;background:transparent;border:none;color:#fff;font-size:16px;resize:none;outline:none;line-height:1.5}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.btn{padding:11px 20px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-gray{background:rgba(255,255,255,.08);color:#ddd}
.btn-purple{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 4px 15px rgba(168,85,247,.4)}
.btn:active{transform:scale(.96)}
.section-title{font-size:13px;color:#a78bfa;letter-spacing:1px;margin:18px 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:18px;overflow:hidden;position:relative;height:140px;background:#1a102e}
.card img{width:100%;height:100%;object-fit:cover}
.card-label{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px;font-weight:600}
.card-sub{font-size:11px;opacity:.8;font-weight:400}
.full-card{grid-column:1/-1;height:110px;margin-top:4px}
.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(11,6,24,.95);backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(168,85,247,.15);z-index:40}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#888;gap:3px}
.nav-item.active{color:#c084fc}
.nav-item svg{width:22px;height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#1a102e;border-radius:22px;padding:22px;width:100%;max-width:360px;border:1px solid rgba(168,85,247,.3)}
.modal h3{margin-bottom:14px;font-size:18px}
.modal input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0f0a1c;color:#fff;margin-bottom:10px;font-size:14px}
.prog-box{text-align:center;color:#fff}
.prog-bar{height:6px;background:rgba(255,255,255,.1);border-radius:10px;margin:16px 0;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#a855f7,#c084fc);width:0%;transition:width .3s}
.screen{display:none;padding:16px;padding-bottom:100px}
.screen.show{display:block}
.story-box{background:linear-gradient(145deg,#1a102e,#120c22);border:1px solid rgba(168,85,247,.25);border-radius:18px;padding:18px;margin-bottom:18px;max-height:52vh;overflow-y:auto;line-height:1.65;font-size:15px;white-space:pre-wrap}
.edit-box{display:none;margin-top:12px}
.edit-box.show{display:block}
.edit-box textarea{width:100%;min-height:70px;background:#0f0a1c;border:1px solid rgba(168,85,247,.4);border-radius:14px;color:#fff;padding:12px;font-size:14px;resize:none;outline:none}
.action-row{display:flex;gap:10px;margin-top:14px}
.action-row .btn{flex:1;text-align:center;padding:13px}
.hid{display:none!important}
.scene-card{background:linear-gradient(145deg,#1a102e,#120c22);border:1px solid rgba(168,85,247,.22);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.scene-num{font-size:12px;color:#c084fc;font-weight:700;margin-bottom:6px}
.scene-text{font-size:14px;line-height:1.55;color:#e9e0ff}
.page-title{font-size:15px;font-weight:700;margin-bottom:14px;color:#e9d5ff}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Velorix AI</div>
  <div class="avatar" id="avatar">V</div>
</div>

<!-- HOME SCREEN -->
<div class="main" id="homeScreen">
  <div class="prompt-box">
    <textarea id="prompt" placeholder="अपनी कहानी लिखें या टॉपिक दें..."></textarea>
    <div class="btn-row">
      <button class="btn btn-gray" id="btnKeys">API Keys</button>
      <button class="btn btn-purple" id="btnCreate">Create</button>
    </div>
  </div>
  <div class="section-title">CREATE</div>
  <div class="grid">
    <div class="card"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80" alt=""><div class="card-label">Text to Video<br><span class="card-sub">कहानी से वीडियो</span></div></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&q=80" alt=""><div class="card-label">Image to Video<br><span class="card-sub">फोटो से मोशन</span></div></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&q=80" alt=""><div class="card-label">Create Image<br><span class="card-sub">AI इमेज</span></div></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&q=80" alt=""><div class="card-label">Full Story Video<br><span class="card-sub">पार्ट्स में लंबी स्टोरी</span></div></div>
    <div class="card full-card" style="background:linear-gradient(135deg,#1e1b4b,#312e81)"><div class="card-label" style="font-size:16px">📷 Gallery<br><span class="card-sub">बनी हुई वीडियो / इमेज</span></div></div>
  </div>
</div>

<!-- STORY RESULT SCREEN -->
<div class="screen" id="storyScreen">
  <div class="page-title">स्टोरी तैयार ✓</div>
  <div class="story-box" id="storyText"></div>
  <div class="edit-box" id="editBox">
    <textarea id="editInput" placeholder="क्या बदलना है? लिखो..."></textarea>
    <div class="action-row" style="margin-top:8px">
      <button class="btn btn-gray" id="btnCancelEdit">Cancel</button>
      <button class="btn btn-purple" id="btnApplyEdit">अपडेट करो</button>
    </div>
  </div>
  <div class="action-row" id="mainActions">
    <button class="btn btn-gray" id="btnEdit">Edit</button>
    <button class="btn btn-purple" id="btnContinue">Continue →</button>
  </div>
</div>

<!-- SCENE BREAKDOWN SCREEN -->
<div class="screen" id="sceneScreen">
  <div class="page-title">स्टोरी को सीन में बाँटा गया</div>
  <div id="sceneList"></div>
  <div class="action-row" style="margin-top:20px">
    <button class="btn btn-gray" id="btnBackStory">← Back</button>
    <button class="btn btn-purple" id="btnNextScene">Next →</button>
  </div>
</div>

<!-- API KEYS MODAL -->
<div class="overlay" id="keysModal">
  <div class="modal">
    <h3>API Keys</h3>
    <input id="kGroq" placeholder="Groq Key (gsk_...)">
    <input id="kGemini" placeholder="Gemini Key">
    <input id="kOR" placeholder="OpenRouter Key (sk-or-...)">
    <div class="action-row">
      <button class="btn btn-gray" id="btnCloseKeys">Close</button>
      <button class="btn btn-purple" id="btnSaveKeys">Save</button>
    </div>
  </div>
</div>

<!-- PROGRESS -->
<div class="overlay" id="progOverlay">
  <div class="prog-box">
    <div id="progMsg" style="font-size:16px;margin-bottom:8px">स्टोरी बन रही है...</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <div id="progPct" style="font-size:13px;color:#a78bfa">0%</div>
  </div>
</div>

<div class="nav">
  <div class="nav-item active"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
  <div class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Promo</div>
  <div class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>Memes</div>
  <div class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>Share</div>
  <div class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile</div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentStory = '';
let scenes = [];

// Load keys
$('kGroq').value = localStorage.getItem('VX_GROQ') || '';
$('kGemini').value = localStorage.getItem('VX_GEMINI') || '';
$('kOR').value = localStorage.getItem('VX_OR') || '';

// API Keys
$('btnKeys').onclick = () => $('keysModal').classList.add('show');
$('btnCloseKeys').onclick = () => $('keysModal').classList.remove('show');
$('btnSaveKeys').onclick = () => {
  localStorage.setItem('VX_GROQ', $('kGroq').value.trim());
  localStorage.setItem('VX_GEMINI', $('kGemini').value.trim());
  localStorage.setItem('VX_OR', $('kOR').value.trim());
  $('keysModal').classList.remove('show');
  alert('Keys saved ✓');
};

function setProg(p, msg) {
  $('progFill').style.width = p + '%';
  $('progPct').textContent = p + '%';
  if (msg) $('progMsg').textContent = msg;
  $('progOverlay').classList.add('show');
}
function hideProg() { $('progOverlay').classList.remove('show'); }

async function callAI(sys, userMsg) {
  const groq = localStorage.getItem('VX_GROQ') || '';
  const gemini = localStorage.getItem('VX_GEMINI') || '';
  const or = localStorage.getItem('VX_OR') || '';

  if (groq) {
    try {
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + groq, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [{ role: 'system', content: sys }, { role: 'user', content: userMsg }],
          temperature: 0.7, max_tokens: 1400
        })
      });
      if (r.ok) {
        const d = await r.json();
        const t = d.choices?.[0]?.message?.content?.trim();
        if (t && t.length > 30) return t;
      }
    } catch(e) {}
  }

  if (gemini) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${gemini}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: sys + '\n\n' + userMsg }] }] })
      });
      if (r.ok) {
        const d = await r.json();
        const t = d.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if (t && t.length > 30) return t;
      }
    } catch(e) {}
  }

  if (or) {
    try {
      const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + or, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'meta-llama/llama-3.3-70b-instruct:free',
          messages: [{ role: 'system', content: sys }, { role: 'user', content: userMsg }]
        })
      });
      if (r.ok) {
        const d = await r.json();
        const t = d.choices?.[0]?.message?.content?.trim();
        if (t && t.length > 30) return t;
      }
    } catch(e) {}
  }
  return null;
}

// Create Story
$('btnCreate').onclick = async () => {
  const p = $('prompt').value.trim();
  if (!p) { alert('पहले कुछ लिखो'); return; }
  setProg(15, 'स्टोरी बन रही है...');
  const sys = 'तुम प्रोफेशनल हिंदी स्टोरी राइटर हो। यूजर के टॉपिक से एक इमोशनल, मजेदार शॉर्ट स्टोरी लिखो (150-250 शब्द)। सिर्फ स्टोरी दो।';
  const story = await callAI(sys, p);
  hideProg();
  if (!story) { alert('स्टोरी नहीं बन पाई। Keys चेक करो।'); return; }
  currentStory = story;
  $('storyText').textContent = story;
  $('homeScreen').style.display = 'none';
  $('storyScreen').classList.add('show');
};

// Edit
$('btnEdit').onclick = () => {
  $('editBox').classList.add('show');
  $('mainActions').classList.add('hid');
  $('editInput').focus();
};
$('btnCancelEdit').onclick = () => {
  $('editBox').classList.remove('show');
  $('mainActions').classList.remove('hid');
};
$('btnApplyEdit').onclick = async () => {
  const sug = $('editInput').value.trim();
  if (!sug) { alert('सुझाव लिखो'); return; }
  setProg(20, 'सुधार हो रहा है...');
  const sys = 'तुम प्रोफेशनल हिंदी स्टोरी राइटर हो। मौजूदा स्टोरी को यूजर के सुझाव के अनुसार सुधारो। सिर्फ सुधारी हुई पूरी स्टोरी दो।';
  const updated = await callAI(sys, `मौजूदा स्टोरी:\n${currentStory}\n\nसुझाव: ${sug}`);
  hideProg();
  if (!updated) { alert('अपडेट नहीं हो पाया'); return; }
  currentStory = updated;
  $('storyText').textContent = updated;
  $('editBox').classList.remove('show');
  $('mainActions').classList.remove('hid');
  $('editInput').value = '';
};

// Continue → Scene Breakdown
$('btnContinue').onclick = async () => {
  setProg(25, 'सीन बना रहा हूँ...');
  const sys = `तुम स्टोरी को 4 से 6 छोटे सीन में तोड़ो। हर सीन 1-2 वाक्य का हो। 
आउटपुट सिर्फ इस फॉर्मेट में दो:
SCENE 1: .....
SCENE 2: .....
SCENE 3: .....
(कोई एक्स्ट्रा टेक्स्ट मत लिखो)`;
  const result = await callAI(sys, currentStory);
  hideProg();

  scenes = [];
  if (result) {
    const lines = result.split('\n').filter(l => l.trim().match(/^SCENE\s*\d+/i));
    lines.forEach(l => {
      const text = l.replace(/^SCENE\s*\d+\s*[:.\-–]\s*/i, '').trim();
      if (text) scenes.push(text);
    });
  }
  // fallback if AI fail
  if (scenes.length < 2) {
    const parts = currentStory.split(/[।.!?]+/).filter(s => s.trim().length > 15);
    scenes = parts.slice(0, 5).map(s => s.trim());
  }

  let html = '';
  scenes.forEach((s, i) => {
    html += `<div class="scene-card"><div class="scene-num">सीन \( {i+1}</div><div class="scene-text"> \){s}</div></div>`;
  });
  $('sceneList').innerHTML = html;

  $('storyScreen').classList.remove('show');
  $('sceneScreen').classList.add('show');
};

// Back from scenes
$('btnBackStory').onclick = () => {
  $('sceneScreen').classList.remove('show');
  $('storyScreen').classList.add('show');
};

// Next (future page)
$('btnNextScene').onclick = () => {
  alert('अगला पेज (Character / Style / Size) जल्द आएगा। अभी के लिए यहीं तक पूरा है।');
};

// Mobile back button
history.pushState({page:'home'}, '', location.href);
window.onpopstate = (e) => {
  if ($('sceneScreen').classList.contains('show')) {
    $('sceneScreen').classList.remove('show');
    $('storyScreen').classList.add('show');
    history.pushState({page:'story'}, '', location.href);
  } else if ($('storyScreen').classList.contains('show')) {
    $('storyScreen').classList.remove('show');
    $('homeScreen').style.display = 'block';
    history.pushState({page:'home'}, '', location.href);
  } else {
    history.pushState({page:'home'}, '', location.href);
  }
};
</script>
</body>
                                                                       </html>
