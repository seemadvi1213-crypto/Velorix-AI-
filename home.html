<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Velorix AI</title>
<style>
:root {
  --bg: #0d0a14;
  --card: rgba(255,255,255,0.06);
  --card-border: rgba(255,255,255,0.09);
  --primary: #a855f7;
  --primary2: #7c3aed;
  --text: #fff;
  --text2: #a1a1aa;
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 75px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px 8px;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.header-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  cursor: pointer;
}

/* Prompt Box */
.prompt-box {
  margin: 12px 16px 20px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 16px;
}
.prompt-box textarea {
  width: 100%;
  min-height: 90px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 16px;
  resize: none;
  font-family: inherit;
}
.prompt-box textarea::placeholder { color: #666; }
.prompt-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
}
.btn {
  padding: 10px 20px;
  border-radius: 25px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.btn-gray {
  background: rgba(255,255,255,0.08);
  color: var(--text);
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  color: white;
}

/* Section Title */
.sec-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 0 18px 12px;
}

/* Create Cards */
.create-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 16px 24px;
}
.create-card {
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  height: 140px;
  cursor: pointer;
  background: #1a1325;
}
.create-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.create-card .card-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
}
.create-card .card-title {
  font-size: 14px;
  font-weight: 600;
}
.create-card .card-sub {
  font-size: 11px;
  color: #ccc;
  margin-top: 2px;
}

/* Trending / Photos Section */
.trending-scroll {
  display: flex;
  gap: 12px;
  padding: 0 16px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.trending-scroll::-webkit-scrollbar { display: none; }
.trend-item {
  min-width: 110px;
  height: 150px;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background: #1a1325;
}
.trend-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.trend-item .trend-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 8px;
  font-size: 11px;
  font-weight: 500;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: rgba(13,10,20,0.97);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: var(--text2);
  cursor: pointer;
  padding: 6px 10px;
}
.nav-item.active { color: var(--primary); }
.nav-item .nav-icon {
  font-size: 22px;
  line-height: 1;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Velorix AI</div>
  <div class="header-avatar" onclick="goProfile()">V</div>
</div>

<!-- Prompt Box -->
<div class="prompt-box">
  <textarea id="promptInput" placeholder="अपनी कहानी लिखें... जैसे गरीब किसान की स्टोरी"></textarea>
  <div class="prompt-actions">
    <button class="btn btn-gray" onclick="openApiKeys()">API Keys</button>
    <button class="btn btn-primary" onclick="startCreate()">Create</button>
  </div>
</div>

<!-- Create Section -->
<div class="sec-title">Create</div>
<div class="create-grid">
  <div class="create-card" onclick="selectMode('text2video')">
    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80" alt="">
    <div class="card-overlay">
      <div class="card-title">Text to Video</div>
      <div class="card-sub">कहानी से वीडियो</div>
    </div>
  </div>
  <div class="create-card" onclick="selectMode('img2video')">
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&q=80" alt="">
    <div class="card-overlay">
      <div class="card-title">Image to Video</div>
      <div class="card-sub">फोटो से मोशन</div>
    </div>
  </div>
  <div class="create-card" onclick="selectMode('createimg')">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400&q=80" alt="">
    <div class="card-overlay">
      <div class="card-title">Create Image</div>
      <div class="card-sub">AI से फोटो</div>
    </div>
  </div>
  <div class="create-card" onclick="selectMode('fullstory')">
    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&q=80" alt="">
    <div class="card-overlay">
      <div class="card-title">Full Story Video</div>
      <div class="card-sub">पूरी कहानी से वीडियो</div>
    </div>
  </div>
</div>

<!-- Trending Photos -->
<div class="sec-title">Trending</div>
<div class="trending-scroll" id="trendingRow">
  <div class="trend-item">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&q=80" alt="">
    <div class="trend-label">3D Style</div>
  </div>
  <div class="trend-item">
    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300&q=80" alt="">
    <div class="trend-label">Realistic</div>
  </div>
  <div class="trend-item">
    <img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=300&q=80" alt="">
    <div class="trend-label">Cinematic</div>
  </div>
  <div class="trend-item">
    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=300&q=80" alt="">
    <div class="trend-label">Anime Mix</div>
  </div>
  <div class="trend-item">
    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&q=80" alt="">
    <div class="trend-label">Portrait</div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goHome()">
    <div class="nav-icon">🏠</div>
    <div>Home</div>
  </div>
  <div class="nav-item" onclick="goPromo()">
    <div class="nav-icon">🎬</div>
    <div>Promo</div>
  </div>
  <div class="nav-item" onclick="goMemes()">
    <div class="nav-icon">😂</div>
    <div>Memes</div>
  </div>
  <div class="nav-item" onclick="goShare()">
    <div class="nav-icon">🔗</div>
    <div>Share</div>
  </div>
  <div class="nav-item" onclick="goProfile()">
    <div class="nav-icon">👤</div>
    <div>Profile</div>
  </div>
</div>

<script>
function startCreate() {
  const text = document.getElementById('promptInput').value.trim();
  if (!text) {
    alert('पहले कहानी लिखो');
    return;
  }
  alert('Create शुरू होगा\n(अगले पार्ट में स्टोरी फ्लो जुड़ेगा)');
}

function openApiKeys() {
  alert('API Keys\n(Owner Profile में शिफ्ट होगा)');
}

function selectMode(mode) {
  alert('Mode selected: ' + mode);
}

function goHome() {}
function goPromo() { alert('Promo section'); }
function goMemes() { alert('Memes section'); }
function goShare() { alert('Share & Rewards'); }
function goProfile() { alert('Profile page\n(PART 2/3 में आएगा)'); }
</script>
</body>
    </html>
