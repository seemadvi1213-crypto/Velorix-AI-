<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velorix AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% -20%, rgba(120, 40, 200, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(0, 180, 255, 0.15), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(255, 50, 120, 0.12), transparent),
        #050505;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      margin-top: 8px;
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      font-weight: 400;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px -12px rgba(0,0,0,0.6);
    }

    .card h2 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
    }

    .card .subtitle {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .btn-google {
      background: #ffffff;
      color: #111;
    }

    .btn-google:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .btn-email {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-email:hover {
      background: rgba(255,255,255,0.12);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    #emailForm {
      display: none;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .input:focus {
      border-color: rgba(167, 139, 250, 0.6);
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
    }

    .footer a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      margin: 0 10px;
    }

    .footer a:hover {
      color: #fff;
    }

    #dashboard {
      display: none;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .user-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 2px solid rgba(167,139,250,0.4);
      object-fit: cover;
    }

    .btn-logout {
      margin-top: 24px;
      background: rgba(255,80,80,0.15);
      color: #ff6b6b;
      border: 1px solid rgba(255,80,80,0.25);
    }

    .loading {
      display: none;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-top: 16px;
    }

    @media (max-width: 480px) {
      .logo h1 {
        font-size: 34px;
      }
      .card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
      <div class="logo">
        <h1>Velorix AI</h1>
        <p>Next-Gen AI Video Creation</p>
      </div>

      <div class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue creating</p>

        <button class="btn btn-google" onclick="signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <button class="btn btn-email" onclick="showEmailForm()">
          Continue with Email
        </button>

        <div id="emailForm">
          <input type="email" id="emailInput" class="input" placeholder="Enter your email" />
          <button class="btn btn-primary" onclick="signInWithEmail()">
            Send Magic Link
          </button>
        </div>

        <div class="loading" id="loadingMsg">Please wait...</div>
      </div>

      <div class="footer">
        <a href="#" onclick="alert('Privacy Policy will be added soon')">Privacy Policy</a>
        <a href="#" onclick="alert('Help section coming soon')">Help</a>
        <a href="#" onclick="alert('Terms of Service coming soon')">Terms</a>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard">
      <div class="logo">
        <h1>Velorix AI</h1>
      </div>

      <div class="user-card">
        <img id="userAvatar" class="avatar" src="" alt="User" />
        <h2 id="userName" style="font-size:20px; margin-bottom:4px;">User</h2>
        <p id="userEmail" style="color:rgba(255,255,255,0.5); font-size:14px;"></p>
        <p style="margin-top:20px; color:rgba(255,255,255,0.6); font-size:15px;">
          You are successfully logged in
        </p>
        <button class="btn btn-logout" onclick="signOut()">Logout</button>
      </div>
    </div>

  </div>

  <script>
    // ======================
    // CLERK SETUP - LIVE KEY
    // ======================
    const PUBLISHABLE_KEY = "pk_live_Y2xlcmsudW5vb3JpeC1haS13ZWIudmVyY2VsLmFwC0";

    const clerk = window.Clerk;
    let isLoaded = false;

    async function initClerk() {
      try {
        await clerk.load({
          publishableKey: PUBLISHABLE_KEY
        });
        isLoaded = true;

        if (clerk.user) {
          showDashboard(clerk.user);
        }

        clerk.addListener(({ user }) => {
          if (user) {
            showDashboard(user);
          } else {
            showLogin();
          }
        });

      } catch (err) {
        console.error("Clerk load error:", err);
        document.getElementById("loadingMsg").style.display = "block";
        document.getElementById("loadingMsg").innerText = "Loading error. Please refresh.";
      }
    }

    function showLogin() {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("dashboard").style.display = "none";
    }

    function showDashboard(user) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      const name = user.fullName || user.firstName || "Creator";
      const email = user.primaryEmailAddress?.emailAddress || "";
      const image = user.imageUrl || "https://www.gravatar.com/avatar/?d=mp";

      document.getElementById("userName").innerText = name;
      document.getElementById("userEmail").innerText = email;
      document.getElementById("userAvatar").src = image;
    }

    function showEmailForm() {
      document.getElementById("emailForm").style.display = "block";
    }

    async function signInWithGoogle() {
      if (!isLoaded) return;
      document.getElementById("loadingMsg").style.display = "block";
      try {
        await clerk.authenticateWithRedirect({
          strategy: "oauth_google",
          redirectUrl: window.location.href,
          redirectUrlComplete: window.location.href
        });
      } catch (err) {
        console.error(err);
        document.getElementById("loadingMsg").innerText = "Google login failed. Try again.";
      }
    }

    async function signInWithEmail() {
      if (!isLoaded) return;
      const email = document.getElementById("emailInput").value.trim();
      if (!email) {
        alert("Please enter your email");
        return;
      }

      document.getElementById("loadingMsg").style.display = "block";
      document.getElementById("loadingMsg").innerText = "Sending magic link...";

      try {
        await clerk.client.signIn.create({
          identifier: email,
          strategy: "email_link",
          redirectUrl: window.location.href
        });
        document.getElementById("loadingMsg").innerText = "Magic link sent! Check your email.";
      } catch (err) {
        console.error(err);
        document.getElementById("loadingMsg").innerText = "Something went wrong. Try Google login.";
      }
    }

    async function signOut() {
      await clerk.signOut();
      showLogin();
    }

    // Start
    initClerk();
  </script>
</body>
    </html>
