<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velorix AI</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
      background:#050505;color:#fff;min-height:100vh;overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    .bg{
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -20%,rgba(120,40,200,.28),transparent),
        radial-gradient(ellipse 60% 40% at 80% 10%,rgba(0,180,255,.18),transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%,rgba(255,50,120,.14),transparent),
        #050505;
    }
    .container{
      position:relative;z-index:10;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 16px;
    }
    .logo{text-align:center;margin-bottom:36px}
    .logo h1{
      font-size:44px;font-weight:700;letter-spacing:-1.5px;
      background:linear-gradient(135deg,#fff 0%,#a78bfa 45%,#60a5fa 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .logo p{margin-top:10px;font-size:15px;color:rgba(255,255,255,.55)}
    .card{
      width:100%;max-width:400px;
      background:rgba(255,255,255,.045);
      backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
      border:1px solid rgba(255,255,255,.09);
      border-radius:24px;padding:40px 28px;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.65);
    }
    .card h2{font-size:23px;font-weight:600;text-align:center;margin-bottom:8px}
    .card .subtitle{text-align:center;font-size:14px;color:rgba(255,255,255,.5);margin-bottom:30px}
    .btn{
      width:100%;padding:15px 20px;border-radius:14px;font-size:15px;font-weight:500;
      border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px;
      transition:all .2s ease;margin-bottom:12px;
    }
    .btn-google{background:#fff;color:#111}
    .btn-google:hover{background:#f2f2f2;transform:translateY(-1px)}
    .btn-logout{
      margin-top:26px;background:rgba(255,80,80,.15);color:#ff6b6b;
      border:1px solid rgba(255,80,80,.25);
    }
    .footer{margin-top:42px;text-align:center;font-size:13px;color:rgba(255,255,255,.35)}
    .footer a{color:rgba(255,255,255,.5);text-decoration:none;margin:0 11px}
    #dashboard{display:none;width:100%;max-width:480px;text-align:center}
    .user-card{
      background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
      border-radius:22px;padding:36px 24px;backdrop-filter:blur(24px);
    }
    .avatar{
      width:76px;height:76px;border-radius:50%;margin:0 auto 18px;
      border:2px solid rgba(167,139,250,.45);object-fit:cover;
    }
    .loading{display:none;text-align:center;color:rgba(255,255,255,.6);font-size:14px;margin-top:16px}
    .status{text-align:center;font-size:13px;color:rgba(255,255,255,.45);margin-top:12px}
    @media(max-width:480px){
      .logo h1{font-size:36px}
      .card{padding:32px 22px}
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
      <div class="logo">
        <h1>Velorix AI</h1>
        <p>Next-Gen AI Video Creation</p>
      </div>

      <div class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue creating</p>

        <button class="btn btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <div class="loading" id="loadingMsg">Please wait...</div>
        <div class="status" id="statusMsg"></div>
      </div>

      <div class="footer">
        <a href="#">Privacy Policy</a>
        <a href="#">Help</a>
        <a href="#">Terms</a>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard">
      <div class="logo"><h1>Velorix AI</h1></div>
      <div class="user-card">
        <img id="userAvatar" class="avatar" src="" alt="User" />
        <h2 id="userName" style="font-size:21px;margin-bottom:6px">User</h2>
        <p id="userEmail" style="color:rgba(255,255,255,.5);font-size:14px"></p>
        <p style="margin-top:22px;color:rgba(255,255,255,.6);font-size:15px">
          You are successfully logged in
        </p>
        <button class="btn btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>

  </div>

  <script>
    // ======================
    // FIREBASE CONFIG
    // ======================
    const firebaseConfig = {
      apiKey: "AIzaSyBwFnbJoKUIDSmyl96EewCGMXg2oVnXot4",
      authDomain: "best-47108.firebaseapp.com",
      projectId: "best-47108",
      storageBucket: "best-47108.firebasestorage.app",
      messagingSenderId: "995954423710",
      appId: "1:995954423710:web:9b3458af61b99e6fb6088f",
      measurementId: "G-CPCRTBG42V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ======================
    // UI HELPERS
    // ======================
    function showLogin() {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("dashboard").style.display = "none";
    }

    function showDashboard(user) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      document.getElementById("userName").innerText = user.displayName || "Creator";
      document.getElementById("userEmail").innerText = user.email || "";
      document.getElementById("userAvatar").src = user.photoURL || "https://www.gravatar.com/avatar/?d=mp";
    }

    function setLoading(text) {
      const el = document.getElementById("loadingMsg");
      el.style.display = "block";
      el.innerText = text;
    }

    function setStatus(text) {
      document.getElementById("statusMsg").innerText = text;
    }

    // ======================
    // AUTH FUNCTIONS
    // ======================
    function loginWithGoogle() {
      setLoading("Opening Google...");
      setStatus("");

      const provider = new firebase.auth.GoogleAuthProvider();

      // Mobile के लिए redirect बेहतर रहता है
      auth.signInWithRedirect(provider)
        .catch((error) => {
          console.error(error);
          setLoading("");
          setStatus("Error: " + error.message);
        });
    }

    function logout() {
      auth.signOut().then(() => {
        showLogin();
        setStatus("");
        document.getElementById("loadingMsg").style.display = "none";
      });
    }

    // ======================
    // CHECK LOGIN STATE
    // ======================
    // पहले redirect result चेक करो
    auth.getRedirectResult()
      .then((result) => {
        if (result.user) {
          showDashboard(result.user);
        }
      })
      .catch((error) => {
        console.error("Redirect error:", error);
        setStatus("Login error: " + error.message);
      });

    // continuously watch auth state
    auth.onAuthStateChanged((user) => {
      if (user) {
        showDashboard(user);
      } else {
        showLogin();
      }
    });
  </script>
</body>
          </html>
