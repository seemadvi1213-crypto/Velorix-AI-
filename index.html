<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velorix AI</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#030303;color:#fff;min-height:100vh}
    .bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(124,58,237,.22),transparent 50%),radial-gradient(ellipse 60% 50% at 90% 10%,rgba(59,130,246,.14),transparent 45%),#030303}
    .screen{display:none;position:relative;z-index:10;min-height:100vh;padding:24px 18px;flex-direction:column;align-items:center}
    .screen.active{display:flex}
    .brand{font-size:19px;font-weight:700;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;align-self:flex-start;max-width:400px;width:100%;margin-bottom:auto}
    .hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;max-width:400px;text-align:center}
    .hero h1{font-size:32px;font-weight:700;line-height:1.25;margin-bottom:12px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero p{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:28px}
    .login-card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:24px 18px}
    .btn-google{width:100%;padding:14px;border-radius:12px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
    .loading,.error{margin-top:12px;font-size:13px;text-align:center}
    .error{color:#f87171}
    .footer{margin-top:24px;font-size:12px;color:rgba(255,255,255,.4)}
    .footer a{color:rgba(255,255,255,.5);margin:0 8px;text-decoration:none}
    .user-row{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;padding:12px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:20px}
    .user-row img{width:36px;height:36px;border-radius:50%}
    .lang-list{width:100%;max-width:400px;max-height:50vh;overflow-y:auto;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
    .lang-item{padding:14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
    .lang-item.selected{background:rgba(124,58,237,.2)}
    .btn{width:100%;max-width:400px;margin-top:16px;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-size:15px;font-weight:600;cursor:pointer;opacity:.5;pointer-events:none}
    .btn.active{opacity:1;pointer-events:auto}
  </style>
</head>
<body>
  <div class="bg"></div>

  <div id="landing" class="screen active">
    <div class="brand">Velorix AI</div>
    <div class="hero">
      <h1>Create stunning<br>AI videos in minutes</h1>
      <p>Turn your ideas into professional short videos with the power of AI.</p>
      <div class="login-card">
        <button class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div class="loading" id="loading" style="display:none">Opening Google...</div>
        <div class="error" id="error"></div>
      </div>
      <div class="footer">
        <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">Help</a>
      </div>
    </div>
  </div>

  <div id="language" class="screen">
    <div class="user-row">
      <img id="avatar" src="" />
      <div>
        <div id="uname" style="font-size:14px"></div>
        <div id="uemail" style="font-size:11px;color:rgba(255,255,255,.4)"></div>
      </div>
      <button onclick="logout()" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.5);font-size:12px">Logout</button>
    </div>
    <h2 style="margin:10px 0 16px;font-size:20px">Select Language</h2>
    <div class="lang-list" id="langList"></div>
    <button class="btn" id="continueBtn">Continue</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBwFnbJoKUIDSmyl96EewCGMXg2oVnXot4",
      authDomain: "best-47108.firebaseapp.com",
      projectId: "best-47108",
      storageBucket: "best-47108.firebasestorage.app",
      messagingSenderId: "995954423710",
      appId: "1:995954423710:web:9b3458af61b99e6fb6088f",
      measurementId: "G-CPCRTBG42V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const languages = [
      {code:"hi",name:"Hindi",native:"हिन्दी"},
      {code:"en",name:"English",native:"English"},
      {code:"ta",name:"Tamil",native:"தமிழ்"},
      {code:"te",name:"Telugu",native:"తెలుగు"},
      {code:"pa",name:"Punjabi",native:"ਪੰਜਾਬੀ"},
      {code:"gu",name:"Gujarati",native:"ગુજરાતી"},
      {code:"bn",name:"Bengali",native:"বাংলা"},
      {code:"mr",name:"Marathi",native:"मराठी"},
      {code:"kn",name:"Kannada",native:"ಕನ್ನಡ"},
      {code:"ml",name:"Malayalam",native:"മലയാളം"}
    ];

    let selected = null;

    function show(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    document.getElementById("googleBtn").onclick = function() {
      document.getElementById("loading").style.display = "block";
      document.getElementById("error").innerText = "";
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(function(result) {
          document.getElementById("loading").style.display = "none";
          goLanguage(result.user);
        })
        .catch(function(err) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").innerText = err.message;
        });
    };

    function goLanguage(user) {
      document.getElementById("avatar").src = user.photoURL || "";
      document.getElementById("uname").innerText = user.displayName || "User";
      document.getElementById("uemail").innerText = user.email || "";
      const list = document.getElementById("langList");
      list.innerHTML = "";
      languages.forEach(function(l) {
        const div = document.createElement("div");
        div.className = "lang-item";
        div.innerHTML = "<b>" + l.name + "</b> <span style='color:rgba(255,255,255,.4);font-size:12px'>" + l.native + "</span>";
        div.onclick = function() {
          selected = l.code;
          document.querySelectorAll(".lang-item").forEach(function(i){i.classList.remove("selected")});
          div.classList.add("selected");
          document.getElementById("continueBtn").classList.add("active");
        };
        list.appendChild(div);
      });
      show("language");
    }

    document.getElementById("continueBtn").onclick = function() {
      if (!selected) return;
      localStorage.setItem("velorix_lang", selected);
      alert("Language saved: " + selected + "\n\nProfile page next.");
    };

    function logout() {
      auth.signOut().then(function(){ show("landing"); });
    }

    auth.onAuthStateChanged(function(user) {
      if (user) goLanguage(user);
      else show("landing");
    });
  </script>
</body>
</html>
