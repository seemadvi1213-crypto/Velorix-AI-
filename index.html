<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REELIFY AI</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b0b0f, #15151f);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-size: 34px;
      font-weight: 700;
      background: linear-gradient(90deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .logo p {
      color: #a1a1aa;
      font-size: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .google-btn {
      width: 100%;
      background: white;
      color: #222;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .google-btn:active {
      transform: scale(0.98);
    }

    .google-btn img {
      width: 22px;
      height: 22px;
    }

    .note {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }

    .error {
      color: #ff6b6b;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #555;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      margin: 0 8px;
    }

    /* Dashboard */
    .dashboard {
      display: none;
    }

    .welcome {
      text-align: center;
      margin-bottom: 32px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #a1a1aa;
      font-size: 14px;
    }

    .menu-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 18px;
      border-radius: 16px;
      font-size: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .menu-btn:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="container" id="loginScreen">
    <div class="logo">
      <h1>REELIFY AI</h1>
      <p>Premium AI Short Video Studio</p>
    </div>

    <div class="card">
      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Google से लॉगिन करें
      </button>

      <p class="note">फोन OTP ऑप्शन जल्द जोड़ा जाएगा</p>
      <div class="error" id="errorMsg"></div>
    </div>

    <div class="footer">
      <a href="#">Privacy Policy</a> • 
      <a href="#">Terms</a>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div class="container dashboard" id="dashboardScreen">
    <div class="welcome">
      <h2 id="userName">स्वागत है</h2>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <button class="menu-btn">+ नई वीडियो बनाएं</button>
      <button class="menu-btn">मेरी वीडियोस</button>
      <button class="menu-btn">प्रीमियम</button>
      <button class="menu-btn">सेटिंग्स</button>

      <button class="logout-btn" onclick="logout()">लॉगआउट</button>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBwFnbJoKUIDSmyl96EewCGMXg2oVnXot4",
      authDomain: "best-47108.firebaseapp.com",
      projectId: "best-47108",
      storageBucket: "best-47108.firebasestorage.app",
      messagingSenderId: "995954423710",
      appId: "1:995954423710:web:9b3458af61b99e6fb6088f",
      measurementId: "G-CPCRTBG42V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Google Login (Redirect - Mobile friendly)
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    }

    // Redirect के बाद रिजल्ट लेना
    auth.getRedirectResult()
      .then((result) => {
        if (result.user) {
          showDashboard(result.user);
        }
      })
      .catch((error) => {
        console.error(error);
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("errorMsg").innerText = "लॉगिन में समस्या आई";
      });

    // पहले से लॉगिन है या नहीं
    auth.onAuthStateChanged((user) => {
      if (user) {
        showDashboard(user);
      }
    });

    function showDashboard(user) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardScreen").style.display = "flex";
      document.getElementById("userName").innerText = "नमस्ते, " + (user.displayName || "यूजर");
      document.getElementById("userEmail").innerText = user.email;
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("dashboardScreen").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
      });
    }
  </script>

</body>
        </html>
